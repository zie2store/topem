<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qur'an Surah Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #surah-display {
            margin-top: 20px;
            font-size: 24px;
            direction: rtl;
            text-align: right;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        select {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        label {
            font-size: 18px;
        }
    </style>
    <!-- jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Qur'an Surah Viewer</h1>

        <!-- Surah Selector -->
        <label for="surah-selector">Select a Surah:</label>
        <select id="surah-selector" onchange="loadSurah()">
            <option value="">Choose a Surah</option>
            <!-- Surah options will be loaded here -->
        </select>

        <div id="surah-display">
            <!-- Arabic text will be displayed here -->
        </div>

        <button id="download-btn" onclick="downloadPDF()" style="display:none;">Download as PDF</button>
    </div>

    <script>
        // Fetch surah list from API and populate the dropdown
        async function loadSurahList() {
            const surahSelector = document.getElementById("surah-selector");
            try {
                const response = await fetch("https://equran.id/api/v2/surat");
                const data = await response.json();
                const surahs = data.data;

                // Populate dropdown with surah names
                surahs.forEach(surah => {
                    const option = document.createElement("option");
                    option.value = surah.nomor;
                    option.textContent = `${surah.nomor}. ${surah.nama}`;
                    surahSelector.appendChild(option);
                });
            } catch (error) {
                console.error("Error fetching surah list: ", error);
            }
        }

        // Load Arabic text for selected surah
        async function loadSurah() {
            const surahId = document.getElementById("surah-selector").value;
            const surahDisplay = document.getElementById("surah-display");
            const downloadBtn = document.getElementById("download-btn");

            if (!surahId) {
                surahDisplay.innerHTML = "";
                downloadBtn.style.display = "none";
                return;
            }

            try {
                const response = await fetch(`https://equran.id/api/v2/surat/${surahId}`);
                const data = await response.json();
                const surah = data.data;

                // Display the Arabic text
                surahDisplay.innerHTML = surah.text;
                downloadBtn.style.display = "inline-block";
            } catch (error) {
                console.error("Error fetching surah data: ", error);
            }
        }

        // Download Arabic text as PDF
        function downloadPDF() {
            const surahText = document.getElementById("surah-display").innerText;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(surahText, 10, 10);
            doc.save("surah.pdf");
        }

        // Load the surah list on page load
        window.onload = function() {
            loadSurahList();
        };
    </script>

</body>
</html>
