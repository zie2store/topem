<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soccer Schedule</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background-color: #f0f0f0;
}
.card-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-header .meta {
  font-size: 0.9em;
  color: #666;
}

.card h3 {
  margin: 8px 0;
  font-size: 1.2em;
  color: #222;
}

.card p {
  margin: 4px 0;
  color: #444;
}

    .card .time {
    margin: 4px 0;
    font-size: 0.9rem;
    color: #444; /* darker so it's visible */
    font-weight: 500;
  }

.watch-btn {
  background: #007BFF;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9em;
  transition: background 0.3s;
}

.watch-btn:hover {
  background: #0056b3;
}

.channel-buttons {
  margin-top: 12px;
  display: none;
  flex-wrap: wrap;
  gap: 8px;
}

.channel-buttons button {
  background: #28a745;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85em;
}

.channel-buttons button:hover {
  background: #1e7e34;
}

summary {
cursor: pointer;
font-weight: bold;
margin-top: 10px;
}
details {
margin-top: 4px;
}
</style>
</head>
<body>
<h1>Soccer Schedule</h1>
<div id="schedule" class="card-container"></div>

<script>
async function loadSchedule() {
  const resp = await fetch('https://cdn.statically.io/gh/zie2store/pndl/main/sch.json');
  const data = await resp.json();

  // Get current date in UK timezone (UTC+0, no DST assumed)
  const todayUk = new Date(new Date().toISOString().split('T')[0] + "T00:00:00Z");

  // Format to match JSON keys
  const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' };
  const formattedKeyDate = todayUk.toLocaleDateString('en-GB', options);
  const suffix = getDaySuffix(todayUk.getUTCDate());
  const key = `${formattedKeyDate.replace(/\d+/, todayUk.getUTCDate() + suffix)} - Schedule Time UK GMT`;

  function getDaySuffix(day) {
    if (day > 3 && day < 21) return 'th';
    switch (day % 10) {
      case 1: return 'st';
      case 2: return 'nd';
      case 3: return 'rd';
      default: return 'th';
    }
  }

  const rawDateMatch = key.match(/(\d{1,2})(?:st|nd|rd|th)? (\w{3}) (\d{4})/i);
  if (!rawDateMatch) return;

  const [_, day, monthStr, year] = rawDateMatch;
  const monthMap = { Jan: '01', Feb: '02', Mar: '03', Apr: '04',
                     May: '05', Jun: '06', Jul: '07', Aug: '08',
                     Sep: '09', Oct: '10', Nov: '11', Dec: '12' };
  const month = monthMap[monthStr];
  const dateString = `${year}-${month}-${day.padStart(2,'0')}`;

  const sports = ['Soccer', 'Tennis', 'Basketball', 'Cricket'];
  let allMatches = [];
  sports.forEach(sport => {
    const matches = data[key]?.[sport] || [];
    matches.forEach(match => {
      match.sportType = sport;
      allMatches.push(match);
    });
  });

  const container = document.getElementById('schedule');
  const now = new Date();

  // Sort matches by time
  allMatches.sort((a, b) => {
    const parseDateTime = (match) => {
      const [hour, minute] = match.time.split(':').map(t => t.padStart(2, '0'));
      return new Date(`${dateString}T${hour}:${minute}:00Z`);
    };
    return parseDateTime(a) - parseDateTime(b);
  });

  // Render cards
  allMatches.forEach(match => {
    const [hour, minute] = match.time.split(':').map(t => t.padStart(2,'0'));
    const matchUtcDateTime = new Date(`${dateString}T${hour}:${minute}:00Z`);

    const diffHours = (now - matchUtcDateTime) / (1000 * 60 * 60);
    if (diffHours > 3) return;

   // --- Parse Competition & Teams ---
const parts = match.event.split(':').map(s => s.trim());
let competition = parts[0] || "";
let teams = parts[1] || "";

// Header row: Category + Watch button
const header = document.createElement('div');
header.className = 'card-header';

const meta = document.createElement('div');
meta.className = 'meta';
meta.textContent = match.sportType;
header.appendChild(meta);

const watchBtn = document.createElement('button');
watchBtn.className = 'watch-btn';
watchBtn.textContent = 'Watch';
header.appendChild(watchBtn);

card.appendChild(header);

// If teams exist, show them as h3, competition in meta
if (teams) {
  // Update meta to include competition
  meta.textContent = `${match.sportType} | ${competition}`;

  const teamsEl = document.createElement('h3');
  teamsEl.textContent = teams;
  card.appendChild(teamsEl);

} else {
  // Show competition styled as teams (below category)
  const compEl = document.createElement('h3');
  compEl.textContent = competition;
  card.appendChild(compEl);
}



// --- Friendly Time ---
const todayUtc = new Date();
todayUtc.setUTCHours(0, 0, 0, 0);

const tomorrowUtc = new Date(todayUtc);
tomorrowUtc.setUTCDate(todayUtc.getUTCDate() + 1);

const matchDayUtc = new Date(matchUtcDateTime);
matchDayUtc.setUTCHours(0, 0, 0, 0);

const isToday = matchDayUtc.getTime() === todayUtc.getTime();
const isTomorrow = matchDayUtc.getTime() === tomorrowUtc.getTime();

const hours = matchUtcDateTime.getUTCHours();
const minutes = matchUtcDateTime.getUTCMinutes();
const ampm = hours >= 12 ? 'PM' : 'AM';
const formattedHour = (hours % 12) || 12;
const formattedMinutes = minutes.toString().padStart(2, '0');

let friendlyTime = `${formattedHour}:${formattedMinutes} ${ampm}`;
if (isToday) {
  friendlyTime = `Today at ${friendlyTime}`;
} else if (isTomorrow) {
  friendlyTime = `Tomorrow at ${friendlyTime}`;
} else {
  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayName = dayNames[matchUtcDateTime.getUTCDay()];
  const monthName = monthNames[matchUtcDateTime.getUTCMonth()];
  const dayNum = matchUtcDateTime.getUTCDate();
  friendlyTime = `${dayName}, ${monthName} ${dayNum} at ${friendlyTime}`;
}

        // --- Show Time ---
const timeEl = document.createElement('p');
timeEl.className = 'time';
timeEl.textContent = friendlyTime;
card.appendChild(timeEl);


    // Channel buttons (hidden initially)
    const channelWrapper = document.createElement('div');
    channelWrapper.className = 'channel-buttons';

    const allChannels = [...(match.channels || []), ...(match.channels2 || [])];
    allChannels.forEach(ch => {
      const btn = document.createElement('button');
      btn.textContent = ch.channel_name;
      btn.onclick = () => {
        window.open(`https://kangdaddy.blogspot.com/?id=${ch.channel_id}`, '_blank');
      };
      channelWrapper.appendChild(btn);
    });

    card.appendChild(channelWrapper);

    // Toggle channel buttons on Watch click
    watchBtn.addEventListener('click', () => {
      const isVisible = channelWrapper.style.display === 'flex';
      channelWrapper.style.display = isVisible ? 'none' : 'flex';
    });

    container.appendChild(card);
  });

  startAutoRemove();
}

function startAutoRemove() {
  removeExpiredCards();
  setInterval(removeExpiredCards, 5 * 60 * 1000);
}

function removeExpiredCards() {
  const now = new Date();
  document.querySelectorAll('.card').forEach(card => {
    const matchTimeIso = card.getAttribute('data-match-time');
    const matchTime = new Date(matchTimeIso);
    const diffHours = (now - matchTime) / (1000 * 60 * 60);
    if (diffHours > 3) {
      card.remove();
    }
  });
}

loadSchedule().catch(err => console.error('Failed to load schedule:', err));
</script>

</body>
</html>
