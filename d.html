<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    .search-container {
      text-align: center;
      margin-bottom: 20px;
    }
    /* Make the search form as wide as the card */
    .search-container input {
      width: 100%;
      max-width: 900px;  /* Match card width */
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;  /* Make padding included in the width */
    }

    .card-container {
      display: flex;
      flex-direction: column;  /* One card per line */
      gap: 20px;
      justify-content: flex-start;
      align-items: center;
        position: relative;  /* Container for cards */
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;  /* Full width of the container */
      max-width: 900px;  /* Max card width */
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;  /* Smooth transition for expansion */
    }
    .card h3 {
      margin: 0 0 10px;
      color: #333;
    }
    .card p {
      margin: 6px 0;
      color: #555;
    }
/* Styling the Watch button */
.card .watch-toggle {
  position: absolute;  /* Position it absolutely within the card */
  right: 20px;
  top: 60px;  /* Vertically center it in the card */
  transform: translateY(-50%);  /* Perfectly center it */
  background: #AD2349;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  border: none;
  transition: background-color 0.3s ease;
}

.card .watch-toggle:hover, .channel-badge:hover {
  background-color: #26B59A;  /* Darker shade on hover */
}

.card .channels {
  display: none;  /* Initially hidden */
  margin-top: 10px;
  text-align: left;
  padding-top: 10px;
  border-top: 1px solid #ddd;
}

.channel-badge {
  background: #AD2349;
  color: #fff;
  padding: 4px 8px;
  border-radius: 4px;
  display: inline-block;
  margin: 2px;
  font-size: 0.9em;
}

.channel-badge a {
  text-decoration: none;
  color: inherit;
}

  </style>
</head>
<body>

<h1>Schedule</h1>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Search by category, tournament, or teams..." onkeyup="filterCards()">
</div>

<div class="card-container" id="cardContainer"></div>

<script>
let allCardsData = [];  // To store all the fetched schedule data

// Fetch the schedule data from the URL
fetch('https://raw.githubusercontent.com/zie2store/pndl/main/sch.json')
  .then(res => res.json())
  .then(data => {
    allCardsData = data;
    renderSchedule(allCardsData);  // Render all cards initially
  })
  .catch(err => console.error('Failed to fetch schedule JSON:', err));

// --- render schedule ---
function renderSchedule(data) {
  const container = document.getElementById("cardContainer");
  container.innerHTML = '';

  const currentTime = new Date();
  const day = Object.keys(data)[0];       // e.g. "Wednesday 27 August 2025"
  const categories = data[day];

  let allMatches = [];

  for (const category in categories) {
    categories[category].forEach(match => {
      const [tournament, teams] = match.event.split(" : ");

      // no conversion, just use JSON values
      const localTime = match.time;
      const localDate = day;
      const matchDate = new Date(); // dummy so sort still works

      function formatUkDateTime(ukDateKey, ukTime) {
  // Example ukDateKey: "Tuesday 26th August 2025"
  const parts = ukDateKey.split(" "); 
  const weekday = parts[0];          // "Tuesday"
  const day = parts[1].replace(/\D/g, "");  // "26" (remove "th", "st", "nd", "rd")
  const month = parts[2];            // "August"

  return `${weekday}, ${month} ${day} at ${ukTime} (UK Time)`;
}


      allMatches.push({ match, category, tournament, teams, localTime, localDate, matchDate });
    });
  }
  

  // render
  allMatches.forEach(item => {
    const card = document.createElement("div");
    const formattedDateTime = formatUkDateTime(day, match.time);
    card.className = "card";
    card.innerHTML = `
      <div>
        ${item.teams ? `<p>${item.category} | ${item.tournament}</p><h3>${item.teams}</h3>` 
                     : `<p>${item.category}</p><h3>${item.tournament}</h3>`}
        <p>${formattedDateTime}</p>
      </div>
      <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
      <div class="channels"></div>
    `;
    const channelsDiv = card.querySelector(".channels");
    [...(item.match.channels || []), ...(item.match.channels2 || [])].forEach(ch => {
      const span = document.createElement("span");
      span.className = "channel-badge";
      const link = document.createElement("a");
      link.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
      link.target = "_blank";
      link.textContent = ch.channel_name;
      span.appendChild(link);
      channelsDiv.appendChild(span);
    });
    container.appendChild(card);
  });
}

// --- filter cards ---
function filterCards() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  const container = document.getElementById("cardContainer");
  container.innerHTML = '';

  const day = Object.keys(allCardsData)[0];
  const categories = allCardsData[day];

  let filteredMatches = [];

  for (const category in categories) {
    categories[category].forEach(match => {
      const [tournament, teams] = match.event.split(" : ");

      const localTime = match.time;
      const localDate = day;

      if (
        category.toLowerCase().includes(query) ||
        tournament.toLowerCase().includes(query) ||
        (teams && teams.toLowerCase().includes(query))
      ) {
        filteredMatches.push({ match, category, tournament, teams, localTime, localDate });
      }
    });
  }

  filteredMatches.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        ${item.teams ? `<p>${item.category} | ${item.tournament}</p><h3>${item.teams}</h3>` 
                     : `<p>${item.category}</p><h3>${item.tournament}</h3>`}
        <p>${item.localDate} at ${item.localTime}</p>
      </div>
      <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
      <div class="channels"></div>
    `;
    const channelsDiv = card.querySelector(".channels");
    [...(item.match.channels || []), ...(item.match.channels2 || [])].forEach(ch => {
      const span = document.createElement("span");
      span.className = "channel-badge";
      const link = document.createElement("a");
      link.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
      link.target = "_blank";
      link.textContent = ch.channel_name;
      span.appendChild(link);
      channelsDiv.appendChild(span);
    });
    container.appendChild(card);
  });
}

// toggle channel list
function toggleChannels(button) {
  const channelsDiv = button.nextElementSibling;
  channelsDiv.style.display = channelsDiv.style.display === "block" ? "none" : "block";
}
</script>



</body>
</html>
