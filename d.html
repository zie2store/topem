<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soccer Schedule</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background-color: #f0f0f0;
}
.card-container {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
gap: 16px;
}
.card {
background: white;
padding: 16px;
border-radius: 8px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
display: flex;
flex-direction: column;
}
.card h3 {
margin: 0 0 8px;
font-size: 1.1em;
color: #333;
}
.card p {
margin: 4px 0;
color: #555;
}
.channel-list {
list-style: none;
padding-left: 16px;
margin: 4px 0;
}
.channel-list li {
margin-bottom: 2px;
}
.channel-list a {
color: #007BFF;
text-decoration: none;
}
.channel-list a:hover {
text-decoration: underline;
}
summary {
cursor: pointer;
font-weight: bold;
margin-top: 10px;
}
details {
margin-top: 4px;
}
</style>
</head>
<body>
<h1>Soccer Schedule</h1>
<div id="schedule" class="card-container"></div>

<script>
async function loadSchedule() {
  const resp = await fetch('https://cdn.statically.io/gh/zie2store/pndl/main/sch.json');
  const data = await resp.json();

  // Get current date in UK timezone (UTC+0, no DST assumed)
const todayUk = new Date(new Date().toISOString().split('T')[0] + "T00:00:00Z");

// Format to match your JSON keys (e.g. "Monday 18th Aug 2025 - Schedule Time UK GMT")
const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' };
const formattedKeyDate = todayUk.toLocaleDateString('en-GB', options);
const suffix = getDaySuffix(todayUk.getUTCDate());
const key = `${formattedKeyDate.replace(/\d+/, todayUk.getUTCDate() + suffix)} - Schedule Time UK GMT`;

console.log("📅 Expected schedule key:", key);

// Helper for day suffixes (st, nd, rd, th)
function getDaySuffix(day) {
  if (day > 3 && day < 21) return 'th';
  switch (day % 10) {
    case 1: return 'st';
    case 2: return 'nd';
    case 3: return 'rd';
    default: return 'th';
  }
}

  console.log("Data key:", key);

  const rawDateMatch = key.match(/(\d{1,2})(?:st|nd|rd|th)? (\w{3}) (\d{4})/i);
  if (!rawDateMatch) {
    console.error("⚠️ Could not extract date from key:", key);
    return;
  }

  const [_, day, monthStr, year] = rawDateMatch;
  const monthMap = { Jan: '01', Feb: '02', Mar: '03', Apr: '04',
                     May: '05', Jun: '06', Jul: '07', Aug: '08',
                     Sep: '09', Oct: '10', Nov: '11', Dec: '12' };
  const month = monthMap[monthStr];
  const dateString = `${year}-${month}-${day.padStart(2,'0')}`;
  console.log("Parsed dateString:", dateString);

  const sports = ['Soccer', 'Tennis', 'Basketball'];
  let allMatches = [];
  sports.forEach(sport => {
    const matches = data[key]?.[sport] || [];
    matches.forEach(match => {
      match.sportType = sport;
      allMatches.push(match);
    });
  });

  console.log("Total matches found:", allMatches.length);

  const container = document.getElementById('schedule');
  const now = new Date();

  
  allMatches.forEach(match => {
    const [hour, minute] = match.time.split(':').map(t => t.padStart(2,'0'));
    const matchUtcDateTime = new Date(`${dateString}T${hour}:${minute}:00Z`);
    console.log(`Match: ${match.event}, Scheduled UTC: ${matchUtcDateTime.toISOString()}`);

    const diffHours = (now - matchUtcDateTime) / (1000 * 60 * 60);
    console.log(" - Time difference in hours:", diffHours.toFixed(2));

    if (diffHours > 3) {
      console.log(` ⏱ Skipping expired match: ${match.event}`);
      return;
    }

    console.log(`  -> Rendering match: ${match.event}`);

    allMatches.sort((a, b) => {
  // Parse the match times into Date objects for comparison
  const parseDateTime = (match) => {
    const [hour, minute] = match.time.split(':').map(t => t.padStart(2, '0'));
    return new Date(`${dateString}T${hour}:${minute}:00Z`);
  };
  return parseDateTime(a) - parseDateTime(b);
});


    const card = document.createElement('div');
    card.className = 'card';
    const title = document.createElement('h3');
    title.textContent = match.event;
    card.appendChild(title);

    const localTimeString = matchUtcDateTime.toLocaleString(undefined, {
      hour: '2-digit', minute: '2-digit',
      day: 'numeric', month: 'short', year: 'numeric',
      timeZoneName: 'short'
    });
    const timeEl = document.createElement('p');
    timeEl.innerHTML = `${localTimeString}`;
    card.appendChild(timeEl);

    const allChannels = [...(match.channels || []), ...(match.channels2 || [])];
    if (allChannels.length) {
      const detailsEl = document.createElement('details');
      const summaryEl = document.createElement('summary');
      summaryEl.textContent = 'Channels';
      detailsEl.appendChild(summaryEl);
      const chList = document.createElement('ul');
      chList.className = 'channel-list';
      allChannels.forEach(ch => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
        a.textContent = ch.channel_name;
        a.target = '_blank';
        li.appendChild(a);
        chList.appendChild(li);
      });
      detailsEl.appendChild(chList);
      card.appendChild(detailsEl);
    }

    card.setAttribute('data-match-time', matchUtcDateTime.toISOString());
    container.appendChild(card);
  });

  startAutoRemove();
}

function startAutoRemove() {
  removeExpiredCards();
  setInterval(removeExpiredCards, 5 * 60 * 1000);
}

function removeExpiredCards() {
  const now = new Date();
  document.querySelectorAll('.card').forEach(card => {
    const matchTimeIso = card.getAttribute('data-match-time');
    const matchTime = new Date(matchTimeIso);
    const diffHours = (now - matchTime) / (1000 * 60 * 60);
    if (diffHours > 3) {
      console.log(`🗑 Removing expired card: ${card.textContent.trim()}, diff: ${diffHours.toFixed(2)}h`);
      card.remove();
    }
  });
}

loadSchedule().catch(err => console.error('Failed to load schedule:', err));
</script>



</body>
</html>
