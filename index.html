<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sports Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* -----------------------------
   GLOBAL
------------------------------*/
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
}

header {
    background: #111827;
    color: #fff;
    padding: 18px;
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 16px;
}

.status {
    text-align: center;
    color: #555;
    margin-bottom: 20px;
}

/* -----------------------------
   GRID
------------------------------*/
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
}

/* -----------------------------
   CARD + FLIP
------------------------------*/
.card {
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.card:hover {
    box-shadow: 6px 6px 0 #3BC1A8;
    transform: translate(-2px, -2px);
}


.card-inner {
    position: relative;
    width: 100%;
    min-height: 165px;
    transform-style: preserve-3d;
    transition: transform 0.6s ease;
}

.card.is-flipped .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    inset: 0;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    backface-visibility: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* -----------------------------
   FRONT
------------------------------*/
.card-front {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.league {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #444;
}

.league img {
    width: 28px;
    height: 28px;
}

.match-time {
    font-size: 13px;
    color: #666;
}

.teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.team {
    display: flex;
    align-items: center;
    gap: 8px;
}

.team img {
    width: 36px;
    height: 36px;
}

.team-name {
    font-size: 14px;
    font-weight: bold;
}

.vs {
    font-weight: bold;
    color: #888;
}

.meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.meta-left,
.meta-right {
    display: flex;
    align-items: center;
}

/* Prevent badge from stretching */
.meta-left .badge {
    white-space: nowrap;
}


/* -----------------------------
   BACK
------------------------------*/
.card-back {
    transform: rotateY(180deg);
    overflow-y: auto;
}

.card-back h4 {
    margin: 0 0 10px;
}

.channels {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}


.channels button {
  border-radius: 6px;
    background: #1C4D8D;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
     border: none;
      padding: 10px;
    margin-bottom: 8px;
    flex: 1 1 calc(25% - 8px);
}
.channels button:hover {
    opacity: 0.85;
}


.player iframe {
    margin-top: 12px;
    border-radius: 10px;
}

/* -----------------------------
   BADGES
------------------------------*/
.badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    color: #000;
    display: inline-block;
}

/* LIVE badge */
.badge.live {
    background: #A8DF8E;
    animation: liveBlink 1.2s infinite;
}

/* UPCOMING badge */
.badge.upcoming {
    background: #FFAAB8;
}

/* Blink animation */
@keyframes liveBlink {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.35;
    }
}

header form {
    margin-top: 12px;
    display: flex;
    justify-content: center;
}

#searchInput {
    width: 100%;
    max-width: 420px;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 14px;
}

#searchInput:focus {
    box-shadow: 0 0 0 2px #3BC1A8;
}


/* -----------------------------
   FOOTER
------------------------------*/
footer {
    text-align: center;
    font-size: 12px;
    color: #777;
    padding: 20px;
}
/* -----------------------------
   POPUP PLAYER
------------------------------*/
.player-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
}

.player-modal.hidden {
    display: none;
}

.player-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
}

.player-box {
    position: relative;
    width: 90%;
    max-width: 960px;
    margin: 5vh auto;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    z-index: 1;
}

.player-box iframe {
    width: 100%;
    height: 70vh;
    border: none;
}

.player-close {
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 2;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    border-radius: 50%;
    width: 32px;
    height: 32px;
}


</style>
</head>
<body>

<header>
    <h1>📅 Sports Schedule</h1>
    <p>Search matches then click the cards to watch!</p>
        <form id="searchForm">
        <input
            type="text"
            id="searchInput"
            placeholder="Search league, sport, or team..."
            autocomplete="off"
        />
    </form>
</header>

<div class="container">
    <div id="status" class="status">Loading events...</div>
    <div id="grid" class="grid"></div>
</div>

<footer>
    Data source: beta.adstrim.ru
</footer>
<div id="playerModal" class="player-modal hidden">
    <div class="player-overlay"></div>

    <div class="player-box">
        <button class="player-close">✕</button>
        <div id="popupPlayer"></div>
    </div>
</div>


<script>
/* -----------------------------
   GLOBAL STATE
------------------------------*/
let allEvents = [];
let activeFlippedCard = null;

const API_URL = "https://beta.adstrim.ru/api/events/";
const gridEl = document.getElementById("grid");
const statusEl = document.getElementById("status");
const searchInput = document.getElementById("searchInput");
const COUNTDOWN_THRESHOLD_MIN = 25;
const COUNTDOWN_THRESHOLD_MS = COUNTDOWN_THRESHOLD_MIN * 60 * 1000;
const modal = document.getElementById("playerModal");
const popupPlayer = document.getElementById("popupPlayer");
const closeBtn = document.querySelector(".player-close");
const overlay = document.querySelector(".player-overlay");


/* -----------------------------
   TIME HELPERS
------------------------------*/
function formatLocalTime(unixSeconds) {
    const date = new Date(unixSeconds * 1000);
    const now = new Date();

    // Normalize dates (ignore time)
    const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

    const eventDay = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

    const diffDays = Math.round(
        (eventDay - today) / (24 * 60 * 60 * 1000)
    );

    const timeStr = date.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit"
    });

    if (diffDays === 0) {
        return `TODAY at ${timeStr}`;
    }

    if (diffDays === 1) {
        return `TOMORROW at ${timeStr}`;
    }

    return date.toLocaleString(undefined, {
        weekday: "short",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}


function isUpcomingOrLive(event) {
    const now = Date.now();
    const start = event.timestamp * 1000;
    const durationMs = (event.duration || 0) * 60000;
    return now < start + durationMs;
}

function isLive(event) {
    const now = Date.now();
    const start = event.timestamp * 1000;
    const end = start + (event.duration || 0) * 60000;
    return now >= start && now < end;
}

function getBadgeState(event) {
    const now = Date.now();
    const start = event.timestamp * 1000;
    const end = start + (event.duration || 0) * 60000;

    if (now >= start && now < end) {
        return { type: "live", text: "LIVE" };
    }

    const diff = start - now;

    if (diff <= COUNTDOWN_THRESHOLD_MS) {
        const totalSeconds = Math.floor(diff / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return {
            type: "countdown",
            text: `Starts in ${minutes}:${seconds.toString().padStart(2, "0")}`
        };
    }

    return { type: "upcoming", text: "UPCOMING" };
}

function sortEvents(events) {
    return [...events].sort((a, b) => {
        const aLive = isLive(a);
        const bLive = isLive(b);

        // LIVE always on top
        if (aLive && !bLive) return -1;
        if (!aLive && bLive) return 1;

        // Same state → earlier kickoff first
        return a.timestamp - b.timestamp;
    });
}
/* -----------------------------
   POPUP PLAYER
------------------------------*/
function openPlayer(channelName) {
    const encoded = encodeURIComponent(channelName);

    popupPlayer.innerHTML = `
        <iframe
            src="https://topembed.pw/channel/${encoded}"
            allowfullscreen>
        </iframe>
    `;

    modal.classList.remove("hidden");
}

function closePlayer() {
    popupPlayer.innerHTML = ""; // stop playback
    modal.classList.add("hidden");
}

closeBtn.onclick = closePlayer;
overlay.onclick = closePlayer;
/* -----------------------------
   RENDER EVENTS
------------------------------*/
function renderEvents(events) {
    gridEl.innerHTML = "";

    if (!events.length) {
        statusEl.textContent = "No results found.";
        return;
    }

    statusEl.textContent = `Showing ${events.length} events`;

    events.forEach(event => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
        <div class="card-inner">
            <div class="card-face card-front">
                <div class="league">
                    <img src="${event.league_image}">
                    <span>${event.league} • ${event.sport}</span>
                </div>
            
                <div class="teams">
                    <div class="team">
                        <img src="${event.home_team_image}">
                        <span class="team-name">${event.home_team}</span>
                    </div>

                    <div class="vs">VS</div>

                    <div class="team">
                        <span class="team-name">${event.away_team}</span>
                        <img src="${event.away_team_image}">
                    </div>
                </div>
              
                <div class="meta">
                  ${(() => {
                      const badge = getBadgeState(event);
                  
                      if (badge.type === "live") {
                          return `
                              <div class="meta-left">
                              </div>
                              <div class="meta-right">
                                  <span class="badge live">LIVE</span>
                              </div>
                          `;
                      }
                  
                      if (badge.type === "countdown") {
                          return `
                              <div class="meta-left">
                              <div class="match-time">
                                   🕒 ${formatLocalTime(event.timestamp)}
                              </div>
                              </div>
                              <div class="meta-right">
                                  <span class="badge upcoming countdown"
                                        data-start="${event.timestamp}">
                                      ${badge.text}
                                  </span>
                              </div>
                          `;
                      }
                  
                      return `
                          <div class="meta-left">
                              <div class="match-time">
                                   🕒 ${formatLocalTime(event.timestamp)}
                              </div>

                          </div>
                          <div class="meta-right">
                              <span class="badge upcoming">UPCOMING</span>
                          </div>
                      `;
                  })()}
                </div>

            </div>

            <div class="card-face card-back">
                <div class="meta">
                  ${(() => {
                      const badge = getBadgeState(event);
                  
                      if (badge.type === "live") {
                          return `
                              <div class="meta-left">
                                  <span class="badge live">LIVE</span>

                              </div>
                          `;
                      }
                  
                      if (badge.type === "countdown") {
                          return `
                              <div class="meta">
                                  <span class="badge upcoming countdown"
                                        data-start="${event.timestamp}">
                                      ${badge.text}
                                  </span>

                              </div>
                          `;
                      }
                  
                      return `
                          <div class="meta">
                              <span class="badge upcoming">UPCOMING</span>
                          </div>
                      `;
                  })()}
                </div>
                <br>
                <div class="teams">
                    <div class="team">
                        <img src="${event.home_team_image}">
                        <span class="team-name">${event.home_team}</span>
                    </div>

                    <div class="vs">VS</div>

                    <div class="team">
                        <span class="team-name">${event.away_team}</span>
                        <img src="${event.away_team_image}">
                    </div>
                </div>
                <br>
                <div class="channels"></div>
                <div class="player"></div>
            </div>
        </div>`;

        /* ---- FLIP LOGIC ---- */
        card.addEventListener("click", e => {
            if (e.target.tagName === "BUTTON") return;

            if (activeFlippedCard && activeFlippedCard !== card) {
                activeFlippedCard.classList.remove("is-flipped");
            }

            card.classList.toggle("is-flipped");
            activeFlippedCard = card.classList.contains("is-flipped") ? card : null;
        });

         /* ---- CHANNELS ---- */
         const channelsEl = card.querySelector(".channels");
         
         (event.channels || []).forEach((ch, index) => {
             const btn = document.createElement("button");
         
             btn.textContent = `LIVE ${index + 1}`;
         
             btn.onclick = e => {
                 e.stopPropagation();
                 openPlayer(ch.name);
             };
         
             channelsEl.appendChild(btn);
         });

        gridEl.appendChild(card);
    });
}

/* -----------------------------
   LOAD EVENTS
------------------------------*/
async function loadEvents() {
    try {
        statusEl.textContent = "Loading events...";
        const res = await fetch(API_URL);
        const json = await res.json();

        if (json.status !== "success") throw new Error("API error");

          allEvents = sortEvents(
              json.data.filter(isUpcomingOrLive)
          );
          
          renderEvents(allEvents);

    } catch (err) {
        console.error(err);
        statusEl.textContent = "Failed to load events.";
    }
}

/* -----------------------------
   SEARCH
------------------------------*/
searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();

    if (!q) {
        renderEvents(sortEvents(filtered));
        return;
    }

    const filtered = allEvents.filter(event => {
        const league = (event.league || "").toLowerCase();
        const sport = (event.sport || "").toLowerCase();
        const home  = (event.home_team || "").toLowerCase();
        const away  = (event.away_team || "").toLowerCase();

        return (
            league.includes(q) ||
            sport.includes(q) ||
            home.includes(q) ||
            away.includes(q)
        );
    });

    renderEvents(sortEvents(filtered));
});

/* -----------------------------
   AUTO REMOVE FINISHED MATCHES
------------------------------*/
setInterval(() => {
    const updated = sortEvents(
        allEvents.filter(isUpcomingOrLive)
    );

    if (updated.length !== allEvents.length) {
        allEvents = updated;
        activeFlippedCard = null;
        renderEvents(allEvents);
    }
}, 60 * 1000);


setInterval(() => {
    document.querySelectorAll(".badge.countdown").forEach(badge => {
        const start = badge.dataset.start * 1000;
        const diff = start - Date.now();

        if (diff <= 0) {
            badge.textContent = "LIVE";
            badge.classList.remove("upcoming", "countdown");
            badge.classList.add("live");
            return;
        }

        const totalSeconds = Math.floor(diff / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        badge.textContent = `Starts in ${minutes}:${seconds
            .toString()
            .padStart(2, "0")}`;
    });
}, 1000);


/* -----------------------------
   INIT
------------------------------*/
loadEvents();
</script>


</body>
</html>
