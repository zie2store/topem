<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Schedule Live Stream</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 p-4 sm:p-6 lg:p-8">
    <div class="container">
        <div class="flex justify-center items-center mb-8 relative">
            <h1 class="text-3xl sm:text-4xl font-bold text-center w-full">Sports Schedule & Live Streams</h1>
            <button id="theme-toggle" class="theme-toggle-button">
                <span id="theme-icon">☀️</span>
            </button>
        </div>

        <!-- Filter and Sort Dropdowns -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 mb-8">
            <div class="flex items-center gap-2">
                <label for="sport-filter" class="text-gray-700 dark:text-gray-300 font-medium">Sport:</label>
                <select id="sport-filter" class="filter-dropdown">
                    <option value="all">All Sports</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label for="tournament-filter" class="text-gray-700 dark:text-gray-300 font-medium">Tournament:</label>
                <select id="tournament-filter" class="filter-dropdown">
                    <option value="all">All Tournaments</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label for="sort-by" class="text-gray-700 dark:text-gray-300 font-medium">Sort By:</label>
                <select id="sort-by" class="filter-dropdown">
                    <option value="default">Date & Time</option>
                    <option value="status">Status</option>
                </select>
            </div>
        </div>

        <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Schedule items will be loaded here by JavaScript -->
            <div class="loading-spinner" id="loading-spinner"></div>
        </div>

        <div id="error-message" class="error-message hidden">
            Failed to load sports schedule. Please try again later.
        </div>
    </div>
	<script src="script.js"></script>
</body>
</html>
