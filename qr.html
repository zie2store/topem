<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Surah Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
      color: #1f2937;
    }
    body.dark-mode {
      background-color: #1f2937;
      color: #f9fafb;
    }
    .surah-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .surah-link {
      text-decoration: none;
      color: inherit;
    }
    .surah-card {
      display: flex;
      align-items: center;
      border: 1px solid #d1d5db;
      padding: 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      background: white;
    }
    .surah-card:hover {
      border-left: 4px solid #2563eb;
      border-bottom: 4px solid #2563eb;
    }
    body.dark-mode .surah-card {
      background: #374151;
      color: #f9fafb;
    }
    .nomor-circle {
      width: 48px;
      height: 48px;
      border: 2px solid #60a5fa;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 12px;
    }
    .surah-info {
      flex-grow: 1;
    }
    .latin-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .latin {
      font-weight: bold;
    }
    .arti {
      font-size: 0.9em;
    }
    .badges {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .badge-fill {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.8em;
    }
    .badge-outline {
      border: 1px solid #60a5fa;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.8em;
    }
    .arabic-name {
      font-family: 'Amiri', serif;
      font-size: 1.5em;
      color: #60a5fa;
      margin-left: auto;
    }
    .surah-detail {
      padding: 24px;
    }
    .surah-title {
      font-family: 'Amiri', serif;
      font-size: 2em;
      text-align: center;
      margin-bottom: 12px;
    }
    .surah-subtitle, .surah-meta {
      text-align: center;
      margin-bottom: 8px;
    }
    .description {
      margin: 16px 0;
      line-height: 1.6;
    }
    .separator {
      border-top: 1px solid #d1d5db;
      margin: 24px 0;
    }
    .ayah {
      margin-bottom: 24px;
    }
    .teks-arab {
      text-align: right;
      font-size: 1.6em;
      font-family: 'Amiri', serif;
    }
    .teks-latin {
      font-style: italic;
    }
    .ayah audio {
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <input class='search-bar' id='search' oninput='filterCards()' placeholder='Mau baca surat apa hari ini?' type='text'/>
  <div id="surahList" class="surah-container"></div>
  <div id="surahDetail" class="surah-detail"></div>

  <script>
const arabicNumerals = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNumber(number) {
  return number.toString().split('').map(d => arabicNumerals[parseInt(d)]).join('');
}

const urlParams = new URLSearchParams(window.location.search);
const suratNomor = urlParams.get("surah");

if (suratNomor) {
  loadSurahDetail(suratNomor);
} else {
  loadSurahList();
}

// LIST SURAT
async function loadSurahList() {
  try {
    const response = await fetch("https://equran.id/api/v2/surat");
    const data = await response.json();

    const listContainer = document.getElementById("surahList");
    data.data.forEach((surah) => {
      const tempatTurun = surah.tempatTurun.toLowerCase() === 'mekah' ? 'Makiyah' : 'Madaniyah';

      const link = document.createElement("a");
      link.href = `?surah=${surah.nomor}`;
      link.className = "surah-link";
      link.setAttribute("data-namalatin", surah.namaLatin.toLowerCase());
      link.setAttribute("data-arti", surah.arti.toLowerCase());
      link.setAttribute("data-tempatturun", tempatTurun.toLowerCase());
      link.setAttribute("data-jumlahayat", surah.jumlahAyat.toString());

      const card = document.createElement("div");
      card.className = "surah-card";
      card.innerHTML = `
        <div class='nomor-circle'>${surah.nomor}</div>
        <div class='surah-info'>
          <div class='latin-wrapper'>
            <div class='latin'>${surah.namaLatin}</div>
            <div class='arti'>(${surah.arti})</div>
          </div>
          <div class='badges'>
            <div class='badge-fill'>${tempatTurun}</div>
            <div class='badge-outline'>${surah.jumlahAyat} ayat</div>
          </div>
        </div>
        <div class='arabic-name'>${surah.nama}</div>
      `;
      link.appendChild(card);
      listContainer.appendChild(link);
    });
  } catch (error) {
    console.error("Gagal memuat data:", error);
  }
}

// DETAIL SURAT
async function loadSurahDetail(nomor) {
  try {
    const response = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
    const data = await response.json();
    const surah = data.data;

    const detailContainer = document.getElementById("surahDetail");
    const tempatTurun = surah.tempatTurun.toLowerCase() === 'mekah' ? 'Makiyah' : 'Madaniyah';

    const detailHTML = `
      <h2 class='surah-arabic-name'>${surah.nama}</h2>
      <div class='surah-meta'>${surah.namaLatin} | ${surah.arti}</div>
      <div class='badges'>
        <div class='badge-fill'>${tempatTurun}</div>
        <div class='badge-outline'>${surah.jumlahAyat} ayat</div>
      </div>
      <hr/>
      <div class='surah-description'>${surah.deskripsi}</div>
      <hr/>
      <div class='audio-controls'>
        <select id='qariSelect'>
          <option value='01'>Abdullah Al-Juhany</option>
          <option value='02'>Abdul Muhsin Al-Qasim</option>
          <option value='03'>Abdurrahman as-Sudais</option>
          <option value='04'>Ibrahim Al-Dossari</option>
          <option value='05'>Misyari Rasyid Al-Afasi</option>
        </select>
        <!-- You can add show/hide and font slider controls here later -->
      </div>
      <hr/>
    `;

    detailContainer.innerHTML = detailHTML;

    const ayahSection = document.createElement("div");
    ayahSection.className = "ayah-section";

    surah.ayat.forEach((ayah) => {
      const ayahDiv = document.createElement("div");
      ayahDiv.className = "ayah";

      ayahDiv.innerHTML = `
        <div class='teks-arab'>${ayah.teksArab}<span class='arabic-number-circle'>${toArabicNumber(ayah.nomorAyat)}</span></div>
        <div class='teks-latin'><em>${ayah.teksLatin}</em></div>
        <div class='teks-indo'>${ayah.teksIndonesia}</div>
        <hr/>
      `;

      ayahSection.appendChild(ayahDiv);
    });

    detailContainer.appendChild(ayahSection);
  } catch (error) {
    console.error("Gagal memuat detail surat:", error);
  }
}

// SEARCH FUNCTION
function filterCards() {
  const query = normalize(document.getElementById("search").value);
  const cards = document.querySelectorAll(".surah-link");

  cards.forEach(card => {
    const namaLatin = normalize(card.getAttribute("data-namalatin"));
    const arti = normalize(card.getAttribute("data-arti"));
    const tempatTurun = normalize(card.getAttribute("data-tempatturun"));
    const jumlahAyat = normalize(card.getAttribute("data-jumlahayat"));

    const isMatch = 
      namaLatin.includes(query) ||
      arti.includes(query) ||
      tempatTurun.includes(query) ||
      jumlahAyat.includes(query);

    card.style.display = isMatch ? "" : "none";
  });
}

function normalize(text) {
  return text
    .toLowerCase()
    .normalize("NFD") 
    .replace(/[̀-ͯ]/g, "")
    .replace(/['\-]/g, "")
    .replace(/[^a-z0-9\s]/gi, "")
    .trim();
}

document.getElementById("search")?.addEventListener("keypress", function (e) {
  if (e.key === "Enter") {
    filterCards();
  }
});
</script>

</body>
</html>
