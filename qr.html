margin-bottom: 10px;

<body>
	<div class='site-header-wrapper'>
      <header class='site-header'>
        <button class='menu-toggle' onclick='toggleMenu()'>&#9776;</button>
        <a class='site-name' href='/'>KANGDADDY</a>
        <nav class='menu' id='menu'>
          <a href='https://livingdaddy.blogspot.com'>SPORT SCHEDULES</a>
          <a href='/'>LIVE CHANNELS</a>
        </nav>
	<div id='darkToggleBtn'/>
        


      </header></div>
<div id="main-container" style="margin-top: 5rem;">
    
    <!-- Headline (only used on /, but can be dynamically hidden in JS if needed) -->
    <h1 id="page-title">Sports Schedule</h1>

    <!-- Search bar (for schedule) -->
    <div class="search-container" id="search-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search by sport, tournament, or teams..." 
        onkeyup="filterCards()">
    </div>

    <!-- Trending tags (for TV page) -->
    <div id="trending" style="margin-top: 10px; display:none;">
      <a class="trending-tag">POPULAR:</a>
      <a class="trending-tag" href="/?id=123">#Astro Sports</a>
      <a class="trending-tag" href="/?id=31">#TNT Sports</a>
      <a class="trending-tag" href="/?id=35">#SKY Sports</a>
      <a class="trending-tag" href="/?id=343">#USA Network</a>
    </div>

    <!-- Universal app container -->
    <div id="app"></div>

  </div>


<script>

function main() {
  const urlParams = new URLSearchParams(window.location.search);
  const tvParam = urlParams.has("tv");
  const idParam = urlParams.get("id");

  const titleEl = document.getElementById("page-title");
  const searchBoxEl = document.getElementById("search-box");
  const trendingEl = document.getElementById("trending");
  const appEl = document.getElementById("app");

  // Reset UI
  titleEl.style.display = "none";
  searchBoxEl.style.display = "none";
  trendingEl.style.display = "none";
  appEl.innerHTML = "";

  if (idParam) {
    // --- Single channel page (/?id=123)
    trendingEl.style.display = "block";
    renderChannelPage(idParam, appEl);

  } else if (tvParam) {
    // --- TV channels list (/?tv)
    titleEl.textContent = "TV Channels";
    titleEl.style.display = "block";
    trendingEl.style.display = "block";
    renderTvPage(appEl);

  } else {
    // --- Home schedule page (/)
    titleEl.textContent = "Sports Schedule";
    titleEl.style.display = "block";
    searchBoxEl.style.display = "block";
    renderSchedule(allCardsData, appEl);
  }
}
// ======================
// Shared Helpers
// ======================
function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

// ======================
// HOME PAGE (Schedule)
// ======================
let allCardsData = [];

async function loadSchedule() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/zie2store/pndl/main/sch.json');
    const data = await res.json();
    allCardsData = data;
    renderSchedule(allCardsData);
  } catch (err) {
    console.error('Failed to fetch schedule JSON:', err);
  }
}

function formatLocalDateTime(ukDateKey, ukTime) {
  const parts = ukDateKey.split(" "); 
  const day = parts[1].replace(/\D/g, ""); 
  const month = parts[2]; 
  const year = parts[3] || new Date().getFullYear();
  const dateStr = `${day} ${month} ${year} ${ukTime} UTC`;
  const ukDate = new Date(dateStr);

  const options = {
    weekday: "long",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  };

  let formatted = new Intl.DateTimeFormat(undefined, options).format(ukDate);
  formatted = formatted.replace(/, (\d{2}:\d{2})$/, " at $1");
  return formatted + " (Local Time)";
}

function parseUkDateTime(day, time) {
  const parts = day.split(" "); 
  const dayNum = parts[1].replace(/\D/g, ""); 
  const month = parts[2]; 
  const year = parts[3] || new Date().getFullYear();
  const dateStr = `${dayNum} ${month} ${year} ${time} UTC`; 
  return new Date(dateStr);
}

function isExpired(matchDate) {
  const now = new Date();
  const threeHours = 3 * 60 * 60 * 1000;
  return now - matchDate > threeHours;
}

function renderSchedule(data) {
  const container = document.getElementById("app");
  container.innerHTML = '';

  let allMatches = [];

  for (const day in data) {
    const categories = data[day];
    for (const category in categories) {
      categories[category].forEach(match => {
        const [tournament, teams] = match.event.split(" : ") || ["", ""];
        const formattedDateTime = formatLocalDateTime(day, match.time);
        const matchDate = parseUkDateTime(day, match.time);
        if (isExpired(matchDate)) return;
        allMatches.push({ match, category, tournament, teams, formattedDateTime, matchDate });
      });
    }
  }

  allMatches.sort((a, b) => a.matchDate - b.matchDate);

  allMatches.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        ${item.teams 
          ? `<p>${item.category} | ${item.tournament}</p><h3>${item.teams}</h3>` 
          : `<p>${item.category}</p><h3>${item.tournament}</h3>`}
        <p>${item.formattedDateTime}</p>
      </div>
      <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
      <div class="channels"></div>
    `;

    const channelsDiv = card.querySelector(".channels");
    [...(item.match.channels || []), ...(item.match.channels2 || [])].forEach(ch => {
      const span = document.createElement("span");
      span.className = "channel-badge";
      const link = document.createElement("a");
      link.href = `/qr.html/?id=${ch.channel_id}`;
      link.target = "_blank";
      link.textContent = ch.channel_name;
      span.appendChild(link);
      channelsDiv.appendChild(span);
    });

    container.appendChild(card);
  });
}

function toggleChannels(button) {
  const channelsDiv = button.nextElementSibling;
  channelsDiv.style.display = channelsDiv.style.display === "block" ? "none" : "block";
}

// ======================
// TV PAGE (Channels)
// ======================
const channelUrl = "https://cdn.jsdelivr.net/gh/zie2store/contoh@main/assets/dd.json";
let channels = [];

async function loadChannels() {
  const response = await fetch(channelUrl);
  const data = await response.json();
  return Array.isArray(data) ? data : [data];
}

function renderList() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div id='controls'>
      <input id='search' placeholder='Search channels…' type='text'/>
      <select id='sort'>
        <option value='default'>Sort by Original Order</option>
        <option value='channelName'>Sort by Channel Name (A-Z)</option>
        <option value='id'>Sort by ID (Ascending)</option>
      </select>
    </div>
    <div class='grid' id='grid'/>
  `;
  document.getElementById("search").addEventListener("input", handleSearch);
  document.getElementById("sort").addEventListener("change", handleSearch);
  handleSearch();
}

function getRandomColor() {
  const colors = ['#FF6B6B','#6BCB77','#4D96FF','#FFC300','#A66DD4','#FF8E72'];
  return colors[Math.floor(Math.random() * colors.length)];
}

function renderCards(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.forEach(ch => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.backgroundColor = getRandomColor();
    card.innerHTML = `
      <a href='/qr.html/?id=${ch.id}'>
        <div class='id'>${ch.id}</div>
        <div class='name'>${ch.channelName}</div>
      </a>
    `;
    grid.appendChild(card);
  });
}

function handleSearch() {
  const term = document.getElementById("search").value.toLowerCase();
  const sortBy = document.getElementById("sort").value;

  let filtered = channels.filter(ch =>
    ch.channelName.toLowerCase().includes(term)
  );

  if (sortBy === "id") {
    filtered.sort((a, b) => a.id - b.id);
  } else if (sortBy === "channelName") {
    filtered.sort((a, b) => a.channelName.localeCompare(b.channelName));
  }

  renderCards(filtered);
}

function renderIframe(id) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class='iframe-wrapper'>
      <div class='iframe-loader' id='iframe-loader'>
        <div class='spinner'></div>
        <p>Loading stream, please wait...</p>
      </div>
      <iframe allow='autoplay;' allowfullscreen='true' allowtransparency='true' frameborder='0' id='thatframe' src='https://daddylive.dad/embed/stream-${id}.php' style='display:none;'></iframe>
    </div>
    <button class='back-button' onclick='window.location.href="./?tv"'>
      ← Back to Channel List
    </button>
    <h2>Channels you might like!</h2>
    <div class='grid' id='grid'></div>
  `;

  const shuffled = [...channels].sort(() => 0.5 - Math.random());
  renderCards(shuffled.slice(0, 12));

  const iframe = document.getElementById("thatframe");
  const loader = document.getElementById("iframe-loader");

  iframe.addEventListener("load", () => {
    loader.style.display = "none";
    iframe.style.display = "block";
  });
}


// ======================
// MAIN ROUTER
// ======================
async function main() {
  const tv = getQueryParam("tv");
  const id = getQueryParam("id");

  if (tv !== null || id) {
    channels = await loadChannels();
    if (id) {
      renderIframe(id);
    } else {
      renderList();
    }
  } else {
    await loadSchedule();
  }
}

main();


  
      
  
</script>
