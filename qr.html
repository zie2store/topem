<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Surah</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body { font-family: sans-serif; background: #f9f9f9; color: #333; padding: 20px; line-height: 1.6; }
    h1 { text-align: center; font-size: 2em; margin-bottom: 0; font-family: 'Amiri', serif; }
    .center { text-align: center; }
    .badge-fill, .badge-outline {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      margin: 4px;
    }
    .badge-fill { background-color: #4da6ff; color: white; }
    .badge-outline { border: 1px solid #4da6ff; color: #4da6ff; }
    .separator { border-top: 1px solid #ccc; margin: 20px 0; }
    .description { max-width: 800px; margin: auto; text-align: justify; }
    .controls { margin: 16px 0; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .ayah { margin-bottom: 20px; }
    .teks-arab { text-align: right; font-size: 24px; font-family: 'Amiri', serif; }
    .teks-latin { font-style: italic; color: #555; }
    .teks-indo { margin-top: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="surah-detail"></div>

  <script>
    async function loadSurahDetail() {
      const params = new URLSearchParams(window.location.search);
      const nomor = params.get('surat');
      if (!nomor) return;

      const response = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
      const { data } = await response.json();

      const container = document.getElementById('surah-detail');

      const tempatTurun = data.tempatTurun.toLowerCase() === 'mekah' ? 'Makiyah' : 'Madaniyah';

      container.innerHTML = `
        <h1>${data.nama}</h1>
        <div class="center">${data.namaLatin} | ${data.arti}</div>
        <div class="center">
          <span class="badge-fill">${tempatTurun}</span>
          <span class="badge-outline">${data.jumlahAyat} ayat</span>
        </div>

        <div class="separator"></div>
        <div class="description">${data.deskripsi}</div>

        <div class="separator"></div>

        <div class="controls">
          <select id="qari-select">
            <option value="01">Abdullah Al-Juhany</option>
            <option value="02">Abdul Muhsin Al-Qasim</option>
            <option value="03">Abdurrahman as-Sudais</option>
            <option value="04">Ibrahim Al-Dossari</option>
            <option value="05">Misyari Rasyid Al-Afasi</option>
          </select>

          <label><input type="checkbox" id="toggle-latin" checked> Teks Latin</label>
          <label><input type="checkbox" id="toggle-indo" checked> Terjemahan</label>
          <label>Font Arab: <input type="range" id="font-slider" min="20" max="48" value="24"></label>
        </div>

        <div class="separator"></div>

        <div id="ayah-list"></div>
      `;

      const ayahList = document.getElementById('ayah-list');
      const qariSelect = document.getElementById('qari-select');

      data.ayat.forEach((ayah, index) => {
        const ayahDiv = document.createElement('div');
        ayahDiv.className = 'ayah';
        ayahDiv.innerHTML = `
          <div class="teks-arab" style="font-size: 24px;">${ayah.teksArab}</div>
          <div class="teks-latin">${ayah.teksLatin}</div>
          <div class="teks-indo">${ayah.teksIndonesia}</div>
          <div class="separator"></div>
        `;
        ayahList.appendChild(ayahDiv);
      });

      document.getElementById('toggle-latin').addEventListener('change', e => {
        document.querySelectorAll('.teks-latin').forEach(el => {
          el.style.display = e.target.checked ? '' : 'none';
        });
      });

      document.getElementById('toggle-indo').addEventListener('change', e => {
        document.querySelectorAll('.teks-indo').forEach(el => {
          el.style.display = e.target.checked ? '' : 'none';
        });
      });

      document.getElementById('font-slider').addEventListener('input', e => {
        document.querySelectorAll('.teks-arab').forEach(el => {
          el.style.fontSize = `${e.target.value}px`;
        });
      });
    }

    loadSurahDetail();
  </script>
</body>
</html>
