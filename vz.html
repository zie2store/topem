<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecteezy URL → Image</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    textarea {
      height: 100px;
      resize: none;
    }
    img {
      max-width: 100%;
      margin-top: 15px;
      border: 1px solid #ccc;
      display: none;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
    a {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Vecteezy Page URL → Image URL</h2>

<input id="pageUrl" placeholder="input url here" />

<button onclick="convert()">Convert</button>

<textarea id="result" readonly></textarea>

<img id="preview" />

<div id="error" class="error">
  Image not found or preview blocked. Use the URL above manually.
</div>

<a id="save" target="_blank">
  <button>Save Image</button>
</a>

<script>
function parseVecteezy(url) {
  const match = url.match(/vector-art\/(\d+)-(.+)/);
  if (!match) return null;

  const rawId = match[1];

  // Remove "-vector-" inside slug
  let slug = match[2].replace(/-vector-/g, "-");

  const padded = rawId.padStart(9, "0");
  const folder =
    padded.slice(0,3) + "/" +
    padded.slice(3,6) + "/" +
    padded.slice(6,9);

  return { folder, slug };
}

function convert() {
  const input = document.getElementById("pageUrl").value.trim();
  const data = parseVecteezy(input);

  if (!data) {
    alert("Invalid Vecteezy URL");
    return;
  }

  const { folder, slug } = data;
  const base =
    `https://static.vecteezy.com/system/resources/previews/${folder}/non_2x/`;

  // Build filename candidates (ORDER MATTERS)
  const filenames = [];

  // 1. Normal vector
  if (!slug.endsWith("-vector")) {
    filenames.push(`${slug}-vector.jpg`);
  }

  // 2. Slug already ends with -vector
  filenames.push(`${slug}.jpg`);

  // 3. Free vector fallback
  if (!slug.endsWith("-vector")) {
    filenames.push(`${slug}-free-vector.jpg`);
  } else {
    filenames.push(`${slug.replace(/-vector$/, "-free-vector")}.jpg`);
  }

  // 4. Vector prefix fallback (NEW RULE)
  filenames.push(`vector-${slug}.jpg`);

  const urls = filenames.map(f => base + f);

  const img = document.getElementById("preview");
  const error = document.getElementById("error");
  const result = document.getElementById("result");
  const save = document.getElementById("save");

  img.style.display = "none";
  error.style.display = "none";

  let index = 0;

  function tryNext() {
    if (index >= urls.length) {
      error.style.display = "block";
      return;
    }

    const current = urls[index];
    result.value = current;
    save.href = current;
    save.style.display = "block";

    img.onload = () => {
      img.style.display = "block";
    };

    img.onerror = () => {
      index++;
      tryNext();
    };

    img.src = current;
  }

  tryNext();
}
</script>

</body>
</html>
