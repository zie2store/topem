<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL to Image URL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    input, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    textarea {
      height: 80px;
      resize: none;
    }
    a {
      display: block;
      margin-top: 10px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>Vecteezy URL → Image URL</h2>

  <input
    id="pageUrl"
    placeholder="Paste Vecteezy page URL"
    value="https://www.vecteezy.com/vector-art/35704845-fish-vector-illustration-clipart-coloring-book-or-coloring-page-for-kids"
  />

  <button onclick="convertUrl()">Convert</button>

  <textarea id="result" readonly></textarea>

  <a id="openLink" target="_blank"></a>

  <button onclick="copyUrl()">Copy Image URL</button>

  <script>
    function convertUrl() {
      const pageUrl = document.getElementById("pageUrl").value;
      const match = pageUrl.match(/vector-art\/(\d+)/);

      if (!match) {
        alert("Invalid Vecteezy URL");
        return;
      }

      const id = match[1];

      // Static preview image URL pattern
      const imageUrl =
        `https://static.vecteezy.com/system/resources/previews/` +
        `${id.slice(0,2)}/${id.slice(2,5)}/${id}/non_2x/` +
        `fish-illustration-clipart-coloring-book-or-coloring-page-for-kids-vector.jpg`;

      document.getElementById("result").value = imageUrl;

      const link = document.getElementById("openLink");
      link.href = imageUrl;
      link.textContent = "Open image in new tab";
    }

    function copyUrl() {
      const textarea = document.getElementById("result");
      textarea.select();
      document.execCommand("copy");
      alert("Image URL copied");
    }
  </script>

</body>
</html>
