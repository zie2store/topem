<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>URL to Image Preview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    img {
      max-width: 100%;
      margin-top: 20px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h2>URL → Image Preview & Save</h2>

  <input
    id="pageUrl"
    placeholder="Paste Vecteezy page URL here"
    value="https://www.vecteezy.com/vector-art/35704845-fish-vector-illustration-clipart-coloring-book-or-coloring-page-for-kids"
  />

  <button onclick="convertUrl()">Preview Image</button>

  <img id="preview" />

  <a id="downloadLink" download style="display:none;">
    <button>Save Image</button>
  </a>

  <script>
    function convertUrl() {
      const pageUrl = document.getElementById("pageUrl").value;

      // Extract ID from Vecteezy URL
      const match = pageUrl.match(/vector-art\/(\d+)/);
      if (!match) {
        alert("Invalid Vecteezy URL");
        return;
      }

      const id = match[1];

      // Build static image URL (Vecteezy pattern)
      const imageUrl =
        `https://static.vecteezy.com/system/resources/previews/` +
        `${id.slice(0,2)}/${id.slice(2,5)}/${id}/non_2x/` +
        `preview.jpg`;

      const img = document.getElementById("preview");
      img.src = imageUrl;

      const link = document.getElementById("downloadLink");
      link.href = imageUrl;
      link.style.display = "block";
    }
  </script>

</body>
</html>
