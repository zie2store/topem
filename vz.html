<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecteezy URL → Image URL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    textarea {
      height: 100px;
      resize: none;
    }
    a {
      display: block;
      margin-top: 10px;
      word-break: break-all;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Vecteezy Page URL → Image URL</h2>

<input
  id="pageUrl"
  placeholder="input url here"
/>

<button onclick="convert()">Convert</button>

<textarea id="result" readonly></textarea>

<a id="open" target="_blank"></a>

<script>
function convert() {
  const url = document.getElementById("pageUrl").value.trim();

  // Extract ID and title
  const match = url.match(/vector-art\/(\d+)-(.+)/);
  if (!match) {
    alert("Invalid Vecteezy URL");
    return;
  }

  const rawId = match[1];
  const title = match[2];

  // Pad ID to 9 digits
  const padded = rawId.padStart(9, "0");

  // Build folder path
  const folder =
    padded.slice(0,3) + "/" +
    padded.slice(3,6) + "/" +
    padded.slice(6,9);

  // Final image URL
  const imageUrl =
    `https://static.vecteezy.com/system/resources/previews/` +
    `${folder}/non_2x/${title}-vector.jpg`;

  document.getElementById("result").value = imageUrl;

  const link = document.getElementById("open");
  link.href = imageUrl;
  link.textContent = "Open image in new tab";
}
</script>

</body>
</html>
