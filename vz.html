<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecteezy URL → All Sizes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    textarea {
      height: 60px;
      resize: none;
    }
    .block {
      margin-top: 25px;
    }
    .label {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .label a {
      font-size: 14px;
      text-decoration: none;
      color: #0066cc;
    }
    img {
      max-width: 100%;
      border: 1px solid #ccc;
      margin-top: 10px;
      display: none;
    }
    .error {
      color: red;
      display: none;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<h2>Vecteezy URL → Small / Large / Preview</h2>

<input id="pageUrl" placeholder="input url here" />
<button onclick="convert()">Convert</button>

<div id="output"></div>

<script>
function parseVecteezy(url) {
  const m = url.match(/vecteezy\.com\/(vector-art|photo|png)\/(\d+)-(.+)/);
  if (!m) return null;

  let slug = m[3];
  const type = m[1];

  if (type === "vector-art") {
    slug = slug.replace(/-vector-/g, "-");
  }

  const id = m[2].padStart(9, "0");
  const folder =
    id.slice(0,3) + "/" +
    id.slice(3,6) + "/" +
    id.slice(6,9);

  const suffix =
    type === "vector-art" ? "vector" :
    type === "photo"      ? "photo"  :
                            "png";

  const ext = type === "png" ? "png" : "jpg";

  return { folder, slug, suffix, ext };
}

function buildFilenames(slug, suffix, ext) {
  const list = [];

  if (!slug.endsWith(`-${suffix}`))
    list.push(`${slug}-${suffix}.${ext}`);

  list.push(`${slug}.${ext}`);

  if (!slug.endsWith(`-${suffix}`))
    list.push(`${slug}-free-${suffix}.${ext}`);
  else
    list.push(`${slug.replace(`-${suffix}`, `-free-${suffix}`)}.${ext}`);

  list.push(`${suffix}-${slug}.${ext}`);

  return list;
}

function createBlock(title, basePath, filenames) {
  const div = document.createElement("div");
  div.className = "block";

  const label = document.createElement("div");
  label.className = "label";
  label.innerHTML = `${title} | `;

  const save = document.createElement("a");
  save.textContent = "Save Image";
  save.style.display = "none";
  save.setAttribute("download", "");

  label.appendChild(save);
  div.appendChild(label);

  const img = document.createElement("img");
  const textarea = document.createElement("textarea");
  textarea.readOnly = true;

  const error = document.createElement("div");
  error.className = "error";
  error.textContent = "Image not found / blocked";

  div.appendChild(img);
  div.appendChild(textarea);
  div.appendChild(error);

  let i = 0;
  function tryNext() {
    if (i >= filenames.length) {
      error.style.display = "block";
      return;
    }

    const url = basePath + filenames[i];
    textarea.value = url;

    img.onload = () => {
      img.style.display = "block";
      save.href = url;
      save.style.display = "inline";
    };

    img.onerror = () => {
      i++;
      tryNext();
    };

    img.src = url;
  }

  tryNext();
  return div;
}

function convert() {
  const container = document.getElementById("output");
  container.innerHTML = "";

  const data = parseVecteezy(
    document.getElementById("pageUrl").value.trim()
  );
  if (!data) {
    alert("Invalid Vecteezy URL");
    return;
  }

  const { folder, slug, suffix, ext } = data;
  const names = buildFilenames(slug, suffix, ext);

  container.appendChild(
    createBlock(
      "Small Size",
      `https://static.vecteezy.com/system/resources/thumbnails/${folder}/small/`,
      names
    )
  );

  container.appendChild(
    createBlock(
      "Large Size",
      `https://static.vecteezy.com/system/resources/thumbnails/${folder}/large/`,
      names
    )
  );

  container.appendChild(
    createBlock(
      "Preview Size",
      `https://static.vecteezy.com/system/resources/previews/${folder}/non_2x/`,
      names
    )
  );
}
</script>

</body>
</html>
