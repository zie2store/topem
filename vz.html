<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecteezy URL → Image</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    textarea {
      height: 90px;
      resize: none;
    }
    img {
      max-width: 100%;
      margin-top: 15px;
      border: 1px solid #ccc;
      display: none;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
    a {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Vecteezy Page URL → Image URL</h2>

<input
  id="pageUrl"
  placeholder="input url here"
/>

<button onclick="convert()">Convert</button>

<textarea id="result" readonly></textarea>

<img id="preview" />

<div id="error" class="error">
  Preview blocked by Vecteezy. Use the URL above and open it in a new tab.
</div>

<a id="save" target="_blank">
  <button>Save Image</button>
</a>

<script>
function convert() {
  const url = document.getElementById("pageUrl").value.trim();

  const match = url.match(/vector-art\/(\d+)-(.+)/);
  if (!match) {
    alert("Invalid Vecteezy URL");
    return;
  }

  const rawId = match[1];

  // Remove "-vector-" from slug
  const title = match[2].replace(/-vector-/g, "-");

  // Pad ID to 9 digits
  const padded = rawId.padStart(9, "0");

  // Folder structure
  const folder =
    padded.slice(0,3) + "/" +
    padded.slice(3,6) + "/" +
    padded.slice(6,9);

  // Final image URL
  const imageUrl =
    `https://static.vecteezy.com/system/resources/previews/` +
    `${folder}/non_2x/${title}-vector.jpg`;

  // Output URL
  document.getElementById("result").value = imageUrl;

  // Save button
  const save = document.getElementById("save");
  save.href = imageUrl;
  save.style.display = "block";

  // Preview attempt
  const img = document.getElementById("preview");
  const error = document.getElementById("error");

  img.style.display = "none";
  error.style.display = "none";

  img.onload = () => {
    img.style.display = "block";
  };

  img.onerror = () => {
    error.style.display = "block";
  };

  img.src = imageUrl;
}
</script>

</body>
</html>
