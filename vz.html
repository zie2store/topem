<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecteezy URL → Image URL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 720px;
      margin: auto;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    textarea {
      height: 90px;
      resize: none;
    }
    a {
      display: block;
      margin-top: 10px;
      word-break: break-all;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Vecteezy Page URL → Image URL</h2>

<input
  id="pageUrl"
  placeholder="Paste Vecteezy page URL"
  value="https://www.vecteezy.com/vector-art/35704845-fish-vector-illustration-clipart-coloring-book-or-coloring-page-for-kids"
/>

<button onclick="convert()">Convert</button>

<textarea id="output" readonly></textarea>

<a id="open" target="_blank"></a>

<button onclick="copy()">Copy Image URL</button>

<script>
function convert() {
  const url = document.getElementById("pageUrl").value;

  // Extract ID and title slug
  const match = url.match(/vector-art\/(\d+)-(.+)$/);
  if (!match) {
    alert("Invalid Vecteezy URL");
    return;
  }

  const id = match[1];
  const title = match[2];

  const imageUrl =
    `https://static.vecteezy.com/system/resources/previews/` +
    `${id.slice(0,2)}/${id.slice(2,5)}/${id}/non_2x/` +
    `${title}-vector.jpg`;

  document.getElementById("output").value = imageUrl;

  const link = document.getElementById("open");
  link.href = imageUrl;
  link.textContent = "Open image in new tab";
}

function copy() {
  const t = document.getElementById("output");
  t.select();
  document.execCommand("copy");
}
</script>

</body>
</html>
