<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Stream Player</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="thatframe" allowfullscreen="true" allow="autoplay;" allowtransparency="true"></iframe>

  <script>
    // Extract channel_id from query string
    function getChannelIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('channel_id');
    }

    const channelId = getChannelIdFromURL();

    if (channelId) {
      const iframe = document.getElementById('thatframe');
      iframe.src = `https://daddylive.dad/embed/stream-${channelId}.php`;
    } else {
      document.body.innerHTML = '<h2 style="color:white; text-align:center;">No channel_id provided in URL.</h2>';
    }
  </script>
