<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport TV Schedule</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        /* Dark mode styles */
        .dark {
            background-color: #1a202c; /* Dark background */
            color: #e2e8f0; /* Light text */
        }
        .dark .bg-white {
            background-color: #2d3748; /* Darker card background */
        }
        .dark .text-gray-800 {
            color: #e2e8f0;
        }
        .dark .text-gray-600 {
            color: #cbd5e0;
        }
        .dark .border-gray-200 {
            border-color: #4a5568;
        }
        .dark .placeholder-gray-500::placeholder {
            color: #a0aec0;
        }
        .dark input {
            background-color: #4a5568;
            color: #e2e8f0;
        }
        .dark button {
            background-color: #4299e1; /* Blue for buttons */
            color: white;
        }
        .dark .hover\:bg-blue-600:hover {
            background-color: #3182ce;
        }
        .dark .focus\:ring-blue-500:focus {
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }
        .dark .dark-mode-toggle {
            background-color: #4a5568;
            color: #e2e8f0;
        }
        .dark .dark-mode-toggle:hover {
            background-color: #64748b;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-md py-4 px-6 flex justify-between items-center rounded-b-lg">
        <div class="flex-grow text-center">
            <h1 class="text-3xl font-bold text-blue-600">Your Favorite Live Sport Schedules</h1>
        </div>
        <button id="darkModeToggle" class="dark-mode-toggle bg-gray-200 text-gray-800 px-4 py-2 rounded-full shadow-sm hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors duration-200">
            Toggle Dark Mode
        </button>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-6 flex-grow">
        <!-- Search Bar -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Search Team, Tournament, or Sport"
                   class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200
                          bg-white text-gray-800 placeholder-gray-500">
        </div>

        <!-- Sport Schedule Cards Container -->
        <div id="scheduleCards" class="grid gap-6">
            <!-- Cards will be dynamically loaded here -->
            <p id="loadingMessage" class="text-center text-gray-600 text-lg">Loading schedules...</p>
            <p id="noResultsMessage" class="text-center text-gray-600 text-lg hidden">No schedules found matching your search.</p>
        </div>
    </main>

    <script>
        const scheduleCardsContainer = document.getElementById('scheduleCards');
        const searchInput = document.getElementById('searchInput');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const loadingMessage = document.getElementById('loadingMessage');
        const noResultsMessage = document.getElementById('noResultsMessage');

        let allScheduleData = []; // To store the original fetched data
        let debounceTimeout;

        // Function to set or toggle dark mode
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Apply theme on initial load
        function applyThemeOnLoad() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Format date and time
        function formatDateTime(timeString) {
            const eventDate = new Date(timeString);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const eventDay = new Date(eventDate.getFullYear(), eventDate.getMonth(), eventDate.getDate());

            let datePart;
            if (eventDay.getTime() === today.getTime()) {
                datePart = 'Today';
            } else if (eventDay.getTime() === tomorrow.getTime()) {
                datePart = 'Tomorrow';
            } else {
                datePart = eventDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            const timePart = eventDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            return `${datePart} | ${timePart}`;
        }

        // Render schedule cards
        function renderScheduleCards(dataToRender) {
            scheduleCardsContainer.innerHTML = ''; // Clear existing cards
            loadingMessage.classList.add('hidden'); // Hide loading message

            if (dataToRender.length === 0) {
                noResultsMessage.classList.remove('hidden');
                return;
            } else {
                noResultsMessage.classList.add('hidden');
            }

            dataToRender.forEach(item => {
                const eventDate = new Date(item.Time);
                const dismissalTime = new Date(eventDate.getTime() + 3 * 60 * 60 * 1000); // 3 hours after event time

                // Only render if the dismissal time is in the future
                if (new Date() < dismissalTime) {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-lg shadow-md flex flex-col md:flex-row items-start md:items-center justify-between border border-gray-200 transition-all duration-300 ease-in-out';
                    card.setAttribute('data-event-time', eventDate.toISOString()); // Store for dismissal logic

                    const matchDisplay = item.Match.includes('-') ?
                        `<span class="font-bold text-xl">${item.Match.replace('-', ' vs ')}</span>` :
                        `<span class="font-bold text-xl">${item.Match}</span>`;

                    card.innerHTML = `
                        <div class="flex-1 mb-4 md:mb-0 md:w-4/5">
                            <p class="text-gray-600 text-sm md:text-base">${item.Sport} | ${item.Tournament}</p>
                            <p class="text-gray-800 mt-1">${matchDisplay}</p>
                            <p class="text-gray-600 text-sm md:text-base mt-1">${formatDateTime(item.Time)}</p>
                        </div>
                        <div class="md:w-1/5 flex flex-col items-stretch md:items-end">
                            <button class="watch-button bg-blue-500 text-white px-4 py-2 rounded-md shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors duration-200 w-full md:w-auto">
                                Watch
                            </button>
                            <div class="live-buttons hidden mt-2 flex flex-col space-y-2 w-full">
                                <!-- Live stream buttons will be inserted here -->
                            </div>
                        </div>
                    `;

                    const watchButton = card.querySelector('.watch-button');
                    const liveButtonsContainer = card.querySelector('.live-buttons');

                    watchButton.addEventListener('click', () => {
                        liveButtonsContainer.classList.toggle('hidden');
                        // Populate live buttons only when expanded
                        if (!liveButtonsContainer.classList.contains('hidden') && liveButtonsContainer.children.length === 0) {
                            const channels = item.Channels.split(',').map(ch => ch.trim()).filter(ch => ch !== '');
                            channels.slice(0, 3).forEach((channel, index) => { // Max 3 buttons
                                const link = document.createElement('a');
                                link.href = `https://topem.vercel.app/embed.html?channel=${encodeURIComponent(channel)}`;
                                link.target = "_blank"; // Open in new tab
                                link.className = 'bg-green-500 text-white px-4 py-2 rounded-md shadow-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition-colors duration-200 text-center';
                                link.textContent = `Live ${index + 1}`;
                                liveButtonsContainer.appendChild(link);
                            });
                        }
                    });

                    scheduleCardsContainer.appendChild(card);
                }
            });
        }

        // Fetch schedule data from API
        async function fetchSchedule() {
            try {
                loadingMessage.classList.remove('hidden');
                noResultsMessage.classList.add('hidden');
                const response = await fetch('https://topembed.pw/api.php?format=json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                allScheduleData = data.filter(item => {
                    // Filter out items with invalid or missing Time
                    try {
                        const eventDate = new Date(item.Time);
                        return !isNaN(eventDate.getTime()); // Check if date is valid
                    } catch (e) {
                        console.error("Invalid time format:", item.Time, e);
                        return false;
                    }
                });
                renderScheduleCards(allScheduleData);
            } catch (error) {
                console.error('Error fetching schedule:', error);
                scheduleCardsContainer.innerHTML = `<p class="text-center text-red-500 text-lg">Failed to load schedules. Please try again later.</p>`;
                loadingMessage.classList.add('hidden');
            }
        }

        // Filter cards based on search input
        function filterCards() {
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(() => {
                const searchTerm = searchInput.value.toLowerCase();
                const filteredData = allScheduleData.filter(item => {
                    const matchText = `${item.Sport} ${item.Tournament} ${item.Match}`.toLowerCase();
                    return matchText.includes(searchTerm);
                });
                renderScheduleCards(filteredData);
            }, 300); // Debounce for 300ms
        }

        // Periodically dismiss cards
        function dismissExpiredCards() {
            const currentCards = Array.from(scheduleCardsContainer.children);
            currentCards.forEach(card => {
                const eventTimeStr = card.getAttribute('data-event-time');
                if (eventTimeStr) {
                    const eventDate = new Date(eventTimeStr);
                    const dismissalTime = new Date(eventDate.getTime() + 3 * 60 * 60 * 1000); // 3 hours after event time
                    if (new Date() >= dismissalTime) {
                        card.remove();
                    }
                }
            });
            // If all cards are dismissed and search input is empty, show no results message
            if (scheduleCardsContainer.children.length === 0 && searchInput.value === '') {
                noResultsMessage.classList.remove('hidden');
            }
        }

        // Event Listeners
        darkModeToggle.addEventListener('click', toggleDarkMode);
        searchInput.addEventListener('input', filterCards);

        // Initial load
        applyThemeOnLoad();
        fetchSchedule();

        // Set up interval for dismissing expired cards (every minute)
        setInterval(dismissExpiredCards, 60 * 1000);
        // Also run once immediately after initial fetch to clean up any already expired cards
        setTimeout(dismissExpiredCards, 1000); // Small delay to ensure cards are rendered first
    </script>
</body>
</html>
