<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soroban Worksheet Generator</title>

<!-- Montserrat -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --primary: #4f46e5;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Montserrat, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  display: flex;
  height: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 20px;
  overflow-y: auto;
}

.sidebar h1 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
}

.section {
  margin-bottom: 20px;
}

.section h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
}

input[type="number"],
select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-family: Montserrat, sans-serif;
  margin-bottom: 10px;
}

.radio-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  font-size: 13px;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

button {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-family: Montserrat, sans-serif;
  cursor: pointer;
}

button:hover {
  opacity: 0.95;
}

/* ---------- Main Preview ---------- */
.main {
  flex: 1;
  padding: 20px;
  overflow: auto;
}

.preview-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}

iframe {
  width: 100%;
  height: 45vh;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  margin-bottom: 16px;
}
  .tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.tab {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: #ffffff;
  color: var(--text);            /* ✅ ADD THIS */
  font-family: Montserrat, sans-serif;
  font-size: 13px;
  cursor: pointer;
}


.tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.iframe-wrapper {
  height: calc(100vh - 80px); /* fills available space */
}

.iframe-wrapper iframe {
  width: 100%;
  height: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}

</style>
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h1>Soroban Worksheet</h1>

    <div class="section">
      <h3>Problem Type</h3>
      <div class="radio-group">
        <label><input type="radio" name="type" value="both" checked> Mixed</label>
        <label><input type="radio" name="type" value="add"> Addition</label>
        <label><input type="radio" name="type" value="sub"> Subtraction</label>
      </div>
    </div>

    <div class="section">
      <h3>Digits</h3>
      <label>Min digits</label>
      <input type="number" id="minD" value="1" min="1" max="9">

      <label>Max digits</label>
      <input type="number" id="maxD" value="2" min="1" max="9">
    </div>

    <div class="section">
      <h3>Problem Size</h3>
      <label>Numbers per problem</label>
      <input type="number" id="numsPerProb" value="2" min="2" max="10">
    </div>

    <div class="section">
      <h3>Difficulty</h3>
      <label>Carry control</label>
      <select id="carryMode">
        <option value="none">No carry</option>
        <option value="single">Single carry</option>
        <option value="multi">Multiple carry</option>
      </select>

      <div class="checkbox">
        <input type="checkbox" id="beginner">
        <label for="beginner">Beginner mode (first number positive)</label>
      </div>
    </div>

    <button onclick="generate()">Generate Worksheet</button>
  </aside>

  <!-- Main Preview -->
  <main class="main">
<div class="tabs">
  <button class="tab active" onclick="showTab('q')">Questions</button>
  <button class="tab" onclick="showTab('a')">Answers</button>
</div>

<div class="iframe-wrapper">
  <iframe id="qFrame"></iframe>
  <iframe id="aFrame" style="display:none;"></iframe>
</div>

  </main>

</div>

<script>
const jsPDF = window.jspdf?.jsPDF || window.jsPDF;

/* ---------------- UI helpers ---------------- */

function showTab(which) {
  const q = document.getElementById("qFrame");
  const a = document.getElementById("aFrame");
  const tabs = document.querySelectorAll(".tab");

  if (which === "q") {
    q.style.display = "block";
    a.style.display = "none";
    tabs[0].classList.add("active");
    tabs[1].classList.remove("active");
  } else {
    q.style.display = "none";
    a.style.display = "block";
    tabs[0].classList.remove("active");
    tabs[1].classList.add("active");
  }
}

/* ---------------- Random helpers ---------------- */

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* ---------------- Soroban logic ---------------- */

/* single digit soroban step */
function sorobanStep(current, delta) {
  let carry = 0;
  let next = current + delta;

  if (next >= 10) {
    next -= 10;
    carry = 1;
  } else if (next < 0) {
    next += 10;
    carry = -1;
  }
  return { next, carry };
}

/* solve multi-column soroban problem */
function solveSoroban(rows) {
  const cols = rows[0].length;
  const result = Array(cols).fill(0);
  let carries = 0;

  for (let c = cols - 1; c >= 0; c--) {
    let digit = 0;

    for (let r = 0; r < rows.length; r++) {
      const step = sorobanStep(digit, rows[r][c]);
      digit = step.next;
      if (step.carry !== 0) carries++;
    }

    result[c] = digit;
  }
  return { result, carries };
}

/* generate one multi-digit row */
function genRow(digits, minVal, maxVal, sign) {
  const row = [];
  for (let i = 0; i < digits; i++) {
    row.push(sign * randInt(minVal, maxVal));
  }
  return row;
}

/* generate one full problem */
function genProblem(
  minDigits,
  maxDigits,
  rowsCount,
  minVal,
  maxVal,
  type,
  carryMode,
  beginner
) {
  while (true) {
    const digits = randInt(minDigits, maxDigits);
    const rows = [];

    for (let i = 0; i < rowsCount; i++) {
      let sign = 1;

      if (!(beginner && i === 0)) {
        if (type === "sub") sign = -1;
        if (type === "both" && Math.random() < 0.5) sign = -1;
      }

      let row = genRow(digits, minVal, maxVal, sign);

      /* beginner restriction */
      if (beginner && i === 0) {
        row = row.map(d => Math.min(Math.abs(d), 5));
      }

      rows.push(row);
    }

    const solved = solveSoroban(rows);

    if (
      (carryMode === "none" && solved.carries === 0) ||
      (carryMode === "single" && solved.carries === 1) ||
      (carryMode === "multi" && solved.carries >= 2)
    ) {
      return { rows, result: solved.result };
    }
  }
}

/* ---------------- PDF generation ---------------- */

function generate() {
  if (!jsPDF) {
    alert("jsPDF not loaded");
    return;
  }

  const minDigits = +document.getElementById("minD").value;
  const maxDigits = +document.getElementById("maxD").value;
  const numsPerProb = +document.getElementById("numsPerProb").value;
  const type = document.querySelector("input[name='type']:checked").value;
  const carryMode = document.getElementById("carryMode").value;
  const beginner = document.getElementById("beginner").checked;

  const qPDF = new jsPDF({ unit: "mm", format: "a4" });
  const aPDF = new jsPDF({ unit: "mm", format: "a4" });

  [qPDF, aPDF].forEach(p => {
    p.setFont("courier");
    p.setFontSize(10);
  });

  /* layout */
  const COLS = 10;
  const digitW = 5;
  const colGap = 5;
  const rowH = 6;
  const sy = 15;
  const pageW = 210;
  const pageH = 297;
  const bottom = 15;

  const problemW = maxDigits * digitW;
  const totalGridW = COLS * (problemW + colGap);
  const sx = (pageW - totalGridW) / 2;

  const problemH = numsPerProb * rowH + rowH * 2;
  const maxBlocks = Math.floor((pageH - sy - bottom) / problemH);

  let y = sy;
  const answers = [];

  /* QUESTIONS */
  for (let b = 0; b < maxBlocks; b++) {
    for (let c = 0; c < COLS; c++) {
      const x = sx + c * (problemW + colGap);

      const prob = genProblem(
        minDigits,
        maxDigits,
        numsPerProb,
        0,
        9,
        type,
        carryMode,
        beginner
      );

      answers.push(prob.result.join(""));

      prob.rows.forEach((row, r) => {
        row.forEach((d, i) => {
          qPDF.text(
            d.toString(),
            x + i * digitW,
            y + r * rowH,
            { align: "right" }
          );
        });
      });

      const lineY = y + numsPerProb * rowH;
      qPDF.line(x, lineY, x + prob.rows[0].length * digitW, lineY);
    }
    y += problemH;
  }

  /* ANSWERS */
  let ay = sy;
  answers.forEach((ans, i) => {
    aPDF.text(ans, sx + (i % 10) * 18, ay, { align: "right" });
    if (i % 10 === 9) ay += 8;
  });

  document.getElementById("qFrame").src =
    URL.createObjectURL(qPDF.output("blob"));
  document.getElementById("aFrame").src =
    URL.createObjectURL(aPDF.output("blob"));

  showTab("q");
}
</script>

</body>
</html>
