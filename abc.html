<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soroban Worksheet Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --primary: #4f46e5;
  --text: #1f2937;
  --border: #e5e7eb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Montserrat, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 20px;
  overflow-y: auto;
}

.sidebar h1 {
  font-size: 18px;
  margin-bottom: 20px;
}

.section {
  margin-bottom: 18px;
}

.section h3 {
  font-size: 12px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

label {
  font-size: 13px;
  display: block;
  margin-bottom: 4px;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
}

.radio-group label {
  display: flex;
  gap: 6px;
}

button {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.tab {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  background: white;
}

.tab.active {
  background: var(--primary);
  color: white;
}

.iframe-wrapper {
  height: calc(100vh - 80px);
}

iframe {
  width: 100%;
  height: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
}
</style>
</head>

<body>
<div class="app">

<!-- Sidebar -->
<aside class="sidebar">
  <h1>Soroban Worksheet</h1>

  <div class="section">
    <h3>Problem Type</h3>
    <div class="radio-group">
      <label><input type="radio" name="type" value="both" checked> Mixed</label>
      <label><input type="radio" name="type" value="add"> Addition</label>
      <label><input type="radio" name="type" value="sub"> Subtraction</label>
    </div>
  </div>

  <div class="section">
    <h3>Digits</h3>
    <label>Min digits</label>
    <input type="number" id="minD" value="1" min="1" max="9">
    <label>Max digits</label>
    <input type="number" id="maxD" value="2" min="1" max="9">
  </div>

  <div class="section">
    <h3>Problem Size</h3>
    <label>Numbers per problem</label>
    <input type="number" id="numsPerProb" value="2" min="2" max="10">
  </div>

  <div class="section">
    <h3>Difficulty</h3>
    <label>Carry control</label>
    <select id="carryMode">
      <option value="none">No carry</option>
      <option value="single">Single carry</option>
      <option value="multi">Multiple carry</option>
    </select>
    <label>
      <input type="checkbox" id="beginner"> Beginner mode (first number positive)
    </label>
  </div>

  <button onclick="generate()">Generate Worksheet</button>
</aside>

<!-- Main -->
<main class="main">
  <div class="tabs">
    <button class="tab active" onclick="showTab('q')">Questions</button>
    <button class="tab" onclick="showTab('a')">Answers</button>
  </div>

  <div class="iframe-wrapper">
    <iframe id="qFrame"></iframe>
    <iframe id="aFrame" style="display:none;"></iframe>
  </div>
</main>

</div>

<script>
const { jsPDF } = window.jspdf;

/* ---------------- UI ---------------- */

function showTab(which) {
  const q = document.getElementById("qFrame");
  const a = document.getElementById("aFrame");
  const tabs = document.querySelectorAll(".tab");

  if (which === "q") {
    q.style.display = "block";
    a.style.display = "none";
    tabs[0].classList.add("active");
    tabs[1].classList.remove("active");
  } else {
    q.style.display = "none";
    a.style.display = "block";
    tabs[0].classList.remove("active");
    tabs[1].classList.add("active");
  }
}

/* ---------------- Helpers ---------------- */

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* convert digit-array to real number string */
function rowToString(row) {
  const negative = row[0] < 0;
  const digits = row.map(d => Math.abs(d)).join("");
  return (negative ? "-" : "") + digits;
}

/* ---------------- Soroban Logic ---------------- */

function sorobanStep(current, delta) {
  let next = current + delta;
  let carry = 0;

  if (next >= 10) {
    next -= 10;
    carry = 1;
  } else if (next < 0) {
    next += 10;
    carry = -1;
  }
  return { next, carry };
}

function solveSoroban(rows) {
  const cols = Math.max(...rows.map(r => r.length));
  const result = Array(cols).fill(0);
  let carries = 0;

  for (let c = cols - 1; c >= 0; c--) {
    let digit = 0;

    for (let r = 0; r < rows.length; r++) {
      const val = rows[r][rows[r].length - cols + c] || 0;
      const step = sorobanStep(digit, val);
      digit = step.next;
      if (step.carry !== 0) carries++;
    }
    result[c] = digit;
  }
  return { result, carries };
}

/* generate ONE row with variable digit length */
function genRow(minDigits, maxDigits, sign) {
  const digits = randInt(minDigits, maxDigits);
  return Array.from({ length: digits }, () => sign * randInt(0, 9));
}

/* generate ONE problem */
function genProblem(minDigits, maxDigits, rowsCount, type, carryMode, beginner) {
  while (true) {
    const rows = [];

    for (let i = 0; i < rowsCount; i++) {
      let sign = 1;

      if (!(beginner && i === 0)) {
        if (type === "sub") sign = -1;
        if (type === "both" && Math.random() < 0.5) sign = -1;
      }
      rows.push(genRow(minDigits, maxDigits, sign));
    }

    const solved = solveSoroban(rows);

    if (
      (carryMode === "none" && solved.carries === 0) ||
      (carryMode === "single" && solved.carries === 1) ||
      (carryMode === "multi" && solved.carries >= 2)
    ) {
      return { rows, result: solved.result };
    }
  }
}

/* ---------------- Layout Helpers ---------------- */

function problemHeight(rowsCount) {
  const rowH = 6;
  const gap = 10;
  return rowsCount * rowH + gap;
}

/* ---------------- Generate PDF ---------------- */

function generate() {
  const minDigits = +document.getElementById("minD").value;
  const maxDigits = +document.getElementById("maxD").value;
  const numsPerProb = +document.getElementById("numsPerProb").value;

  const type = document.querySelector("input[name='type']:checked").value;
  const carryMode = document.getElementById("carryMode").value;
  const beginner = document.getElementById("beginner").checked;

  const qPDF = new jsPDF({ unit: "mm", format: "a4" });
  const aPDF = new jsPDF({ unit: "mm", format: "a4" });

  [qPDF, aPDF].forEach(p => {
    p.setFont("helvetica");
    p.setFontSize(11);
  });

  const pageTop = 20;
  const pageBottom = 20;
  const pageHeight = 297;

  let y = pageTop;
  const answers = [];

  /* QUESTIONS – fill page vertically */
  while (y + problemHeight(numsPerProb) < pageHeight - pageBottom) {

    const prob = genProblem(
      minDigits,
      maxDigits,
      numsPerProb,
      type,
      carryMode,
      beginner
    );

    prob.rows.forEach((row, i) => {
      qPDF.text(
        rowToString(row),
        70,
        y + i * 6,
        { align: "right" }
      );
    });

    /* separator line */
    qPDF.line(
      40,
      y + numsPerProb * 6 + 1,
      70,
      y + numsPerProb * 6 + 1
    );

    answers.push(rowToString(prob.result));
    y += problemHeight(numsPerProb);
  }

  /* ANSWERS */
  y = pageTop;
  answers.forEach(ans => {
    aPDF.text(ans, 70, y, { align: "right" });
    y += 8;
  });

  document.getElementById("qFrame").src = qPDF.output("bloburl");
  document.getElementById("aFrame").src = aPDF.output("bloburl");
}
</script>

</body>
</html>
