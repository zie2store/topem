<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soroban Worksheet Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --primary: #4f46e5;
  --text: #1f2937;
  --border: #e5e7eb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Montserrat, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 20px;
  overflow-y: auto;
}

.sidebar h1 {
  font-size: 18px;
  margin-bottom: 20px;
}

.section {
  margin-bottom: 18px;
}

.section h3 {
  font-size: 12px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

label {
  font-size: 13px;
  display: block;
  margin-bottom: 4px;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
}

.radio-group label {
  display: flex;
  gap: 6px;
}

button {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.tab {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  background: white;
}

.tab.active {
  background: var(--primary);
  color: white;
}

.iframe-wrapper {
  height: calc(100vh - 80px);
}

iframe {
  width: 100%;
  height: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
}
</style>
</head>

<body>
<div class="app">

<!-- Sidebar -->
<aside class="sidebar">
  <h1>Soroban Worksheet</h1>

  <div class="section">
    <h3>Problem Type</h3>
    <div class="radio-group">
      <label><input type="radio" name="type" value="both" checked> Mixed</label>
      <label><input type="radio" name="type" value="add"> Addition</label>
      <label><input type="radio" name="type" value="sub"> Subtraction</label>
    </div>
  </div>

  <div class="section">
    <h3>Digits</h3>
    <label>Min digits</label>
    <input type="number" id="minD" value="1" min="1" max="9">
    <label>Max digits</label>
    <input type="number" id="maxD" value="2" min="1" max="9">
  </div>

  <div class="section">
    <h3>Problem Size</h3>
    <label>Numbers per problem</label>
    <input type="number" id="numsPerProb" value="2" min="2" max="10">
  </div>

  <div class="section">
    <h3>Difficulty</h3>
    <label>Carry control</label>
    <select id="carryMode">
      <option value="none">No carry</option>
      <option value="single">Single carry</option>
      <option value="multi">Multiple carry</option>
    </select>
    <label>
      <input type="checkbox" id="beginner"> Beginner mode (first number positive)
    </label>
  </div>

  <button onclick="generate()">Generate Worksheet</button>
</aside>

<!-- Main -->
<main class="main">
  <div class="tabs">
    <button class="tab active" onclick="showTab('q')">Questions</button>
    <button class="tab" onclick="showTab('a')">Answers</button>
  </div>

  <div class="iframe-wrapper">
    <iframe id="qFrame"></iframe>
    <iframe id="aFrame" style="display:none;"></iframe>
  </div>
</main>

</div>

<script>
const { jsPDF } = window.jspdf;

/* ---------- Helpers ---------- */

function showTab(which) {
  const q = qFrame, a = aFrame;
  document.querySelectorAll(".tab").forEach((t,i)=>{
    t.classList.toggle("active",(which==="q")===(!i));
  });
  q.style.display = which==="q"?"block":"none";
  a.style.display = which==="a"?"block":"none";
}

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

/* Convert digit-row to proper number string */
function rowToString(row){
  const neg = row[0]<0;
  const digits = row.map(d=>Math.abs(d)).join("");
  return (neg?"-":"")+digits;
}

/* ---------- Soroban Logic ---------- */

function sorobanStep(cur,delta){
  let next=cur+delta,carry=0;
  if(next>=10){next-=10;carry=1;}
  if(next<0){next+=10;carry=-1;}
  return {next,carry};
}

function solveSoroban(rows){
  const cols=rows[0].length;
  const res=Array(cols).fill(0);
  let carries=0;

  for(let c=cols-1;c>=0;c--){
    let d=0;
    rows.forEach(r=>{
      const s=sorobanStep(d,r[c]);
      d=s.next;
      if(s.carry)carries++;
    });
    res[c]=d;
  }
  return {res,carries};
}

function genRow(digits,sign){
  return Array.from({length:digits},()=>sign*randInt(0,9));
}

function genProblem(minD,maxD,rowsN,type,carryMode,beginner){
  while(true){
    const digits=randInt(minD,maxD);
    const rows=[];
    for(let i=0;i<rowsN;i++){
      let sign=1;
      if(!(beginner&&i===0)){
        if(type==="sub")sign=-1;
        if(type==="both"&&Math.random()<0.5)sign=-1;
      }
      rows.push(genRow(digits,sign));
    }
    const sol=solveSoroban(rows);
    if(
      carryMode==="none"&&sol.carries===0||
      carryMode==="single"&&sol.carries===1||
      carryMode==="multi"&&sol.carries>=2
    ) return {rows,result:sol.res};
  }
}

/* ---------- Generate ---------- */

function generate(){
  const minD=+minD.value,
        maxD=+maxD.value,
        nums=+numsPerProb.value,
        type=document.querySelector("input[name=type]:checked").value,
        carry=carryMode.value,
        beginner=beginner.checked;

  const qPDF=new jsPDF({unit:"mm",format:"a4"});
  const aPDF=new jsPDF({unit:"mm",format:"a4"});

  [qPDF,aPDF].forEach(p=>{
    p.setFont("helvetica");
    p.setFontSize(11);
  });

  let y=20;
  const answers=[];

  for(let i=0;i<20;i++){
    const p=genProblem(minD,maxD,nums,type,carry,beginner);
    p.rows.forEach((r,j)=>{
      qPDF.text(rowToString(r), 60, y+j*6,{align:"right"});
    });
    qPDF.line(40,y+nums*6+1,60,y+nums*6+1);
    answers.push(rowToString(p.result));
    y+=nums*6+12;
  }

  y=20;
  answers.forEach(a=>{
    aPDF.text(a,60,y,{align:"right"});
    y+=10;
  });

  qFrame.src=qPDF.output("bloburl");
  aFrame.src=aPDF.output("bloburl");
}
</script>
</body>
</html>
