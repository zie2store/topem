<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soroban Worksheet Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial, sans-serif; }
iframe { width: 100%; height: 420px; border: 1px solid #ccc; }
.controls { margin-bottom: 10px; }
</style>
</head>

<body>

<h3>Soroban Worksheet Generator V</h3>

<div class="controls">
  Problem Type:
  <label><input type="radio" name="type" value="both" checked> Mixed</label>
  <label><input type="radio" name="type" value="add"> Add</label>
  <label><input type="radio" name="type" value="sub"> Sub</label>

  &nbsp;&nbsp;
  Min digits <input type="number" id="minD" value="1" min="1" max="9">
  Max digits <input type="number" id="maxD" value="2" min="1" max="9">
  
  &nbsp;&nbsp;
  Pages <input type="number" id="pages" value="1" min="1">
  Numbers per problem:
<input type="number" id="numsPerProb" value="2" min="2" max="10">

  Carry:
<select id="carryMode">
  <option value="none">No carry</option>
  <option value="single">Single carry</option>
  <option value="multi">Multiple carry</option>
</select>

<label>
  <input type="checkbox" id="beginner">
  Beginner mode
</label>

  &nbsp;&nbsp;
  <button onclick="generate()">Generate</button>
</div>

<b>Questions</b>
<iframe id="qFrame"></iframe>

<b>Answers</b>
<iframe id="aFrame"></iframe>

<script>
const jsPDF = window.jspdf?.jsPDF || window.jsPDF;
console.log("jsPDF loaded:", jsPDF);


function rand(d) {
  const min = 10 ** (d - 1);
  const max = 10 ** d - 1;
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function countCarries(nums) {
  let carries = 0;
  let running = 0;

  for (let n of nums) {
    const before = running;
    running += n;

    // detect carry or borrow at unit place
    if (
      Math.abs(before % 10 + n % 10) >= 10 ||
      Math.abs(before % 10 + n % 10) < 0
    ) {
      carries++;
    }
  }
  return carries;
}

function genColumn(minD, maxD, type, carryMode, beginner, count) {
  while (true) {
    let nums = [];
    let sum = 0;

    for (let i = 0; i < count; i++) {
      const d = Math.floor(Math.random() * (maxD - minD + 1)) + minD;
      let v = rand(d);

      if (i === 0 && beginner) {
        v = Math.abs(v);
      } else {
        if (type === "sub") v = -v;
        if (type === "both" && Math.random() < 0.5) v = -v;
      }

      nums.push(v);
      sum += v;
    }

    if (sum < 0) continue;

    const carries = countCarries(nums);

    if (
      (carryMode === "none" && carries === 0) ||
      (carryMode === "single" && carries === 1) ||
      (carryMode === "multi" && carries >= 2)
    ) {
      return { nums, sum };
    }
  }
}


function generate() {
  const minD = +document.getElementById("minD").value;
  const maxD = +document.getElementById("maxD").value;
  const pages = +document.getElementById("pages").value;
  const type = document.querySelector("input[name='type']:checked").value;

  const qPDF = new jsPDF({ unit: "mm", format: "a4" });
  const aPDF = new jsPDF({ unit: "mm", format: "a4" });

  [qPDF, aPDF].forEach(p => {
    p.setFont("courier");
    p.setFontSize(10);
  });

const numsPerProb = +document.getElementById("numsPerProb").value;

// layout constants
const COLS = 10;
const rowH = 6;
const sx = 12;
const sy = 15;
const pageHeight = 297; // A4 mm
const bottomMargin = 15;

// dynamic problem height
const problemHeight = numsPerProb * rowH + 2 * rowH;

// how many blocks fit vertically
const maxBlocks = Math.floor(
  (pageHeight - sy - bottomMargin) / problemHeight
);


  let answers = [];

for (let b = 0; b < maxBlocks; b++) {
  for (let c = 0; c < COLS; c++) {
    const x = sx + c * colW;
    const col = genColumn(
      minD,
      maxD,
      type,
      carryMode,
      beginner,
      numsPerProb
    );

    answers.push(col.sum);

    col.nums.forEach((n, i) => {
      qPDF.text(n.toString(), x, y + i * rowH, { align: "right" });
    });

    qPDF.line(
      x - 6,
      y + numsPerProb * rowH + 2,
      x + 6,
      y + numsPerProb * rowH + 2
    );
  }
  y += problemHeight;
}

  // ---- ANSWER PDF ----
  let ay = sy;
  answers.forEach((a, i) => {
    if (i > 0 && i % 70 === 0) {
      aPDF.addPage();
      ay = sy;
    }
    aPDF.text(a.toString(), sx + (i % 10) * colW, ay, { align: "right" });
    if (i % 10 === 9) ay += 8;
  });

const qFrame = document.getElementById("qFrame");
const aFrame = document.getElementById("aFrame");

qFrame.src = URL.createObjectURL(qPDF.output("blob"));
aFrame.src = URL.createObjectURL(aPDF.output("blob"));

}
 
</script>
</body>
</html>
