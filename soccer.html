
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Schedule</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    .search-container {
      text-align: center;
      margin-bottom: 20px;
    }
    /* Make the search form as wide as the card */
    .search-container input {
      width: 100%;
      max-width: 900px;  /* Match card width */
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;  /* Make padding included in the width */
    }

    .card-container {
      display: flex;
      flex-direction: column;  /* One card per line */
      gap: 20px;
      justify-content: flex-start;
      align-items: center;
        position: relative;  /* Container for cards */
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;  /* Full width of the container */
      max-width: 900px;  /* Max card width */
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;  /* Smooth transition for expansion */
    }
    .card h3 {
      margin: 0 0 10px;
      color: #333;
    }
    .card p {
      margin: 6px 0;
      color: #555;
    }
/* Styling the Watch button */
.card .watch-toggle {
  position: absolute;  /* Position it absolutely within the card */
  right: 20px;
  top: 60px;  /* Vertically center it in the card */
  transform: translateY(-50%);  /* Perfectly center it */
  background: #AD2349;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  border: none;
  transition: background-color 0.3s ease;
}

.card .watch-toggle:hover, .channel-badge:hover {
  background-color: #26B59A;  /* Darker shade on hover */
}

.card .channels {
  display: none;  /* Initially hidden */
  margin-top: 10px;
  text-align: left;
  padding-top: 10px;
  border-top: 1px solid #ddd;
}

.channel-badge {
  background: #AD2349;
  color: #fff;
  padding: 4px 8px;
  border-radius: 4px;
  display: inline-block;
  margin: 2px;
  font-size: 0.9em;
}

.channel-badge a {
  text-decoration: none;
  color: inherit;
}

  </style>
</head>
<body>

<h1>Sports Schedule</h1>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Search by sport, tournament, or teams..." onkeyup="filterCards()">
</div>

<div class="card-container" id="cardContainer"></div>

<script>
let allCardsData = [];  // To store all the fetched schedule data

// Fetch the schedule data from the URL
fetch('https://raw.githubusercontent.com/zie2store/pndl/main/sch.json')
  .then(res => res.json())
  .then(data => {
    allCardsData = data;
    renderSchedule(allCardsData);  // Render all cards initially
  })
  .catch(err => console.error('Failed to fetch schedule JSON:', err));

// --- helper: format local datetime from UK datetime ---
function formatLocalDateTime(ukDateKey, ukTime) {
  // Example ukDateKey: "Friday 29th Aug 2025 - Schedule Time UK GMT"
  const parts = ukDateKey.split(" "); 
  const weekday = parts[0];                // Friday
  const day = parts[1].replace(/\D/g, ""); // 29
  const month = parts[2];                  // Aug
  const year = parts[3] || new Date().getFullYear();

  // Build a UTC date string (UK GMT = UTC+0)
  const dateStr = `${day} ${month} ${year} ${ukTime} UTC`;
  const ukDate = new Date(dateStr);

  // Convert to local time string
  const options = {
    weekday: "long",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false // or true if you want AM/PM
  };
  const localStr = new Intl.DateTimeFormat(undefined, options).format(ukDate);

  return `${localStr} (Local Time)`;
}

// --- helper: parse UK datetime into JS Date ---
function parseUkDateTime(day, time) {
  const parts = day.split(" "); 
  const dayNum = parts[1].replace(/\D/g, ""); 
  const month = parts[2]; 
  const year = parts[3] || new Date().getFullYear();
  const dateStr = `${dayNum} ${month} ${year} ${time} UTC`; 
  return new Date(dateStr);
}


// --- check if match expired (3 hours ago) ---
function isExpired(matchDate) {
  const now = new Date();
  const threeHours = 3 * 60 * 60 * 1000;
  return now - matchDate > threeHours;
}

// --- render schedule ---
function renderSchedule(data) {
  const container = document.getElementById("cardContainer");
  container.innerHTML = '';

  let allMatches = [];

  for (const day in data) {
    const categories = data[day];
    for (const category in categories) {
      categories[category].forEach(match => {
        const [tournament, teams] = match.event.split(" : ") || ["", ""];
        const formattedDateTime = formatUkDateTime(day, match.time);
        const matchDate = parseUkDateTime(day, match.time);

        // skip expired
        if (isExpired(matchDate)) return;

        allMatches.push({ match, category, tournament, teams, formattedDateTime, matchDate });
      });
    }
  }

  allMatches.sort((a, b) => a.matchDate - b.matchDate);

  allMatches.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        ${item.teams 
          ? `<p>${item.category} | ${item.tournament}</p><h3>${item.teams}</h3>` 
          : `<p>${item.category}</p><h3>${item.tournament}</h3>`}
        <p>${item.formattedDateTime}</p>
      </div>
      <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
      <div class="channels"></div>
    `;

    const channelsDiv = card.querySelector(".channels");
    [...(item.match.channels || []), ...(item.match.channels2 || [])].forEach(ch => {
      const span = document.createElement("span");
      span.className = "channel-badge";
      const link = document.createElement("a");
      link.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
      link.target = "_blank";
      link.textContent = ch.channel_name;
      span.appendChild(link);
      channelsDiv.appendChild(span);
    });

    container.appendChild(card);
  });
}

// --- filter cards ---
function filterCards() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  const container = document.getElementById("cardContainer");
  container.innerHTML = '';

  let filteredMatches = [];

  for (const day in allCardsData) {
    const categories = allCardsData[day];
    for (const category in categories) {
      categories[category].forEach(match => {
        const [tournament, teams] = match.event.split(" : ") || ["", ""];
        const formattedDateTime = formatUkDateTime(day, match.time);
        const matchDate = parseUkDateTime(day, match.time);

        // skip expired
        if (isExpired(matchDate)) return;

        if (
          category.toLowerCase().includes(query) ||
          tournament.toLowerCase().includes(query) ||
          (teams && teams.toLowerCase().includes(query))
        ) {
          filteredMatches.push({ match, category, tournament, teams, formattedDateTime, matchDate });
        }
      });
    }
  }

  filteredMatches.sort((a, b) => a.matchDate - b.matchDate);

  filteredMatches.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        ${item.teams 
          ? `<p>${item.category} | ${item.tournament}</p><h3>${item.teams}</h3>` 
          : `<p>${item.category}</p><h3>${item.tournament}</h3>`}
        <p>${item.formattedDateTime}</p>
      </div>
      <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
      <div class="channels"></div>
    `;

    const channelsDiv = card.querySelector(".channels");
    [...(item.match.channels || []), ...(item.match.channels2 || [])].forEach(ch => {
      const span = document.createElement("span");
      span.className = "channel-badge";
      const link = document.createElement("a");
      link.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
      link.target = "_blank";
      link.textContent = ch.channel_name;
      span.appendChild(link);
      channelsDiv.appendChild(span);
    });

    container.appendChild(card);
  });
}

// toggle channel list
function toggleChannels(button) {
  const channelsDiv = button.nextElementSibling;
  channelsDiv.style.display = channelsDiv.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
