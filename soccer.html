<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    .search-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .search-container input {
      width: 100%;
      max-width: 900px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: flex-start;
      align-items: center;
      position: relative;
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;
    }
    .card h3 {
      margin: 0 0 10px;
      color: #333;
    }
    .card p {
      margin: 6px 0;
      color: #555;
    }
    .card .watch-toggle {
      position: absolute;
      right: 20px;
      top: 60px;
      transform: translateY(-50%);
      background: #AD2349;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      border: none;
      transition: background-color 0.3s ease;
    }

    .card .watch-toggle:hover, .channel-badge:hover {
      background-color: #26B59A;
    }

    .card .channels {
      display: none;
      margin-top: 10px;
      text-align: left;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }

    .channel-badge {
      background: #AD2349;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin: 2px;
      font-size: 0.9em;
    }

    .channel-badge a {
      text-decoration: none;
      color: inherit;
    }

  </style>
</head>
<body>

<h1>Schedule</h1>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Search by category, tournament, or teams..." onkeyup="filterCards()">
</div>

<div class="card-container" id="cardContainer"></div>

<script>
  let allCardsData = [];  // To store all the fetched schedule data

  // Fetch the schedule data from the URL
  fetch('https://cdn.jsdelivr.net/gh/zie2store/pndl@refs/heads/main/sch.json')
    .then(res => res.json())
    .then(data => {
      allCardsData = data;
      renderSchedule(allCardsData);  // Render all cards initially
    })
    .catch(err => console.error('Failed to fetch schedule JSON:', err));

  // Function to convert UK time (GMT) to local time of the user
function convertToLocalTime(ukTime) {
  const currentDate = new Date();
  const [hour, minute] = ukTime.split(":").map(Number);
  const ukDate = new Date(Date.UTC(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate(), hour, minute));
  const localDate = new Date(ukDate);

  const localTimeString = localDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  // Get the local date in a readable format
  const localDateString = localDate.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  // Compare the current date and the match date to return "Today" or "Tomorrow"
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);

  const matchDate = new Date(localDate);

  let displayDate = localDateString; // Default to full date

  if (isSameDay(today, matchDate)) {
    displayDate = "Today";
  } else if (isSameDay(tomorrow, matchDate)) {
    displayDate = "Tomorrow";
  }

  return { time: localTimeString, date: displayDate, matchDate: localDate };
}

// Helper function to compare two dates (ignoring time)
function isSameDay(date1, date2) {
  return date1.getDate() === date2.getDate() &&
         date1.getMonth() === date2.getMonth() &&
         date1.getFullYear() === date2.getFullYear();
}

// Render the full schedule initially
function renderSchedule(data) {
  const container = document.getElementById("cardContainer");
  container.innerHTML = '';  // Clear the existing cards

  const currentTime = new Date(); // Get current time

  const day = Object.keys(data)[0];
  const categories = data[day];

  for (const category in categories) {
    const matches = categories[category];
    matches.forEach(match => {
      const card = document.createElement("div");
      card.className = "card";

      const [tournament, teams] = match.event.split(" : ");
      const { time: localTime, date: localDate, matchDate } = convertToLocalTime(match.time);

      // Calculate the difference in hours
      const timeDiffInHours = (currentTime - matchDate) / (1000 * 60 * 60); // Difference in hours

      // If the match time is more than 3 hours ago, skip this match
      if (timeDiffInHours > 3) {
        return;  // Skip rendering this match card
      }


        card.innerHTML = `
          <div>
            ${teams ? `<p>${category} | ${tournament}</p><h3>${teams}</h3>` : `<p>${category}</p><h3>${tournament}</h3>`}
            <p>${localDate} at ${localTime}</p>
          </div>
          <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
          <div class="channels"></div>
        `;

        const allChannels = [...(match.channels || []), ...(match.channels2 || [])];
        const channelsDiv = card.querySelector(".channels");
        allChannels.forEach(ch => {
          const span = document.createElement("span");
          span.className = "channel-badge";
          const link = document.createElement("a");
          link.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
          link.target = "_blank";  
          link.textContent = ch.channel_name;
          span.appendChild(link);
          channelsDiv.appendChild(span);
        });

        container.appendChild(card);
      });
    }
  }

// Function to update the URL with the query string
function updateUrlQuery(query) {
  const newUrl = `/?q=${encodeURIComponent(query)}`;
  window.history.pushState({ path: newUrl }, '', newUrl);
}

// Function to get query from the URL
function getQueryFromUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('q') || '';
}

// Filter cards based on the search query
function filterCards() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  updateUrlQuery(query);  // Update the URL with the current query
  
  const container = document.getElementById("cardContainer");
  container.innerHTML = '';  // Clear the existing cards
  
  const currentTime = new Date(); // Get current time

  const day = Object.keys(allCardsData)[0];
  const categories = allCardsData[day];
  
  for (const category in categories) {
    const matches = categories[category];
    matches.forEach(match => {
      const card = document.createElement("div");
      card.className = "card";

      const [tournament, teams] = match.event.split(" : ");
      const { time: localTime, date: localDate, matchDate } = convertToLocalTime(match.time);

      // Calculate the difference in hours
      const timeDiffInHours = (currentTime - matchDate) / (1000 * 60 * 60); // Difference in hours

      // If the match time is more than 3 hours ago, skip this match
      if (timeDiffInHours > 3) {
        return;  // Skip rendering this match card
      }

      // Check if the query matches any part of the card info (category, tournament, or teams)
      if (
        category.toLowerCase().includes(query) ||
        tournament.toLowerCase().includes(query) ||
        (teams && teams.toLowerCase().includes(query))
      ) {
        card.innerHTML = `
          <div>
            ${teams ? `<p>${category} | ${tournament}</p><h3>${teams}</h3>` : `<p>${category}</p><h3>${tournament}</h3>`}
            <p>${localDate} at ${localTime}</p>
          </div>
          <button class="watch-toggle" onclick="toggleChannels(this)">Watch</button>
          <div class="channels"></div>
        `;

        const allChannels = [...(match.channels || []), ...(match.channels2 || [])];
        const channelsDiv = card.querySelector(".channels");
        allChannels.forEach(ch => {
          const span = document.createElement("span");
          span.className = "channel-badge";
          const link = document.createElement("a");
          link.href = `https://kangdaddy.blogspot.com/?id=${ch.channel_id}`;
          link.target = "_blank";  
          link.textContent = ch.channel_name;
          span.appendChild(link);
          channelsDiv.appendChild(span);
        });

        container.appendChild(card);
      }
    });
  }
}

// On page load, if there is a query in the URL, apply it to the search bar and filter the cards
window.onload = function() {
  const query = getQueryFromUrl();
  document.getElementById("searchInput").value = query; // Set the search input value from URL
  
  // Trigger the filtering process based on the URL query
  if (query) {
    filterCards();
  } else {
    renderSchedule(allCardsData);  // Render all data if no query is present
  }
};

  // Function to toggle visibility of the channels list
  function toggleChannels(button) {
    const channelsDiv = button.nextElementSibling;
    const isVisible = channelsDiv.style.display === "block";
    channelsDiv.style.display = isVisible ? "none" : "block";
  }

</script>

</body>
</html>
